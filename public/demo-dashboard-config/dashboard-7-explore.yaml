# 031-all-panel-demo-content — User Story 1. Free-form exploration of the
# real ActivitySim demo data.
#
# 030-sidebar-navigation, FR-012/FR-012a: this tab is now genuinely
# single-panel — its former "About This Demo" markdown panel relocated to
# dashboard-1-overview.yaml (see that file's own comment) — so it
# qualifies for the new chromeless full-page mode (FR-008 requires exactly
# one panel across all of `layout`). `icon: compass` reuses this app's own
# already-established icon for the graphic-walker/explore concept
# (GraphicWalkerPanel.tsx's own empty-state icon), not independently
# re-chosen (FR-012). This is the real, live demonstration
# `contracts/dashboard-grammar.md`'s own corrected full-page example now
# matches exactly.

header:
  tab: Explore
  title: Explore the Demo Data
  icon: compass
  full_page: true

layout:
  # 065-chart-builder: the Explore builder replaces Graphic Walker here. Graphic Walker stays registered (type:
  # graphic-walker) but is hidden from the demo until the builder is accepted.
  row_explore:
    - type:  explore-builder
      title: Explore the Demo Data
      width: 1.0
