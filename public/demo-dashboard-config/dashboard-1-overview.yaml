# 026-activitysim-demo-content — User Story 4. Landing page for this
# feature's new demo-dashboard-config content root (constitution Principle
# VII: the first dashboard-*.yaml in index.json is the landing page).
# Real, non-zero scalar KPIs plus overall mode-share/purpose breakdowns —
# orienting context around the two headline causal-story tabs
# (Destination Choice, Transit Service), not proof of either story itself.

header:
  tab: Overview
  title: ActivitySim Demo — Overview

layout:
  # 030-sidebar-navigation, FR-012a: relocated here from dashboard-5-
  # explore.yaml's own former "About This Demo" panel — that tab needed to
  # become genuinely single-panel (a graphic-walker panel alone) to
  # qualify for the new chromeless full-page mode (FR-008 requires exactly
  # one panel). This tab already introduces the same three real scenarios
  # this content describes, making it a coherent, natural home rather than
  # an arbitrary relocation target (spec.md's own explicit reasoning).
  # Content itself is UNCHANGED from its original authoring (031-all-
  # panel-demo-content) — only its location moved.
  row_about:
    - type: markdown
      title: About This Demo
      width: 1.0
      content: |
        ## Real ActivitySim Output — Three Scenarios

        Every number on every tab in this demo comes from three real runs of
        ActivitySim's own `prototype_mtc` example — a genuine 25-zone subset
        (TAZ 1-25) of MTC's real, full 1,454-zone Bay Area travel model
        geography, not a synthetic test system.

        - **Baseline** — the unmodified `prototype_mtc` example, run as-is.
        - **Density Variant** — TAZ 1's employment raised ~40% before the
          run. TAZ 1 is San Francisco's real Financial District (confirmed
          directly against MTC's own published TAZ boundary data) —
          already a real employment center in the baseline
          (27,318 jobs vs. 82 residents). Raising it further produces a
          real, measured ~37-40% increase in trips/tours destined there —
          see the Destination Choice tab.
        - **Transit Variant** — AM/PM `WALK_LOC` (walk-to-local-bus) travel
          time cut 20% and wait time cut 50% before the run. Produces a
          real, measured ~+1 percentage-point `WALK_LOC` mode-share
          increase specifically in the AM/PM periods, with midday/evening
          periods essentially flat as an internal control — see the
          Transit Service tab.

        Explore the real data freely on the Explore tab — drag fields onto
        any shelf, no reactive filters, a snapshot view of the underlying
        real data.

  row_kpis:
    - type:   valuebox
      title:  Households
      metric: summary_kpis
      column: total_households
      format: "{:,.0f}"
      icon:   home
      width:  0.2

    - type:   valuebox
      title:  Persons
      metric: summary_kpis
      column: total_persons
      format: "{:,.0f}"
      icon:   users
      width:  0.2

    - type:   valuebox
      title:  Tours
      metric: summary_kpis
      column: total_tours
      format: "{:,.0f}"
      icon:   route
      width:  0.2

    - type:   valuebox
      title:  Trips
      metric: summary_kpis
      column: total_trips
      format: "{:,.0f}"
      icon:   map-pin
      width:  0.2

    - type:   valuebox
      title:  Trips / Household
      metric: summary_kpis
      column: trips_per_household
      format: "{:.2f}"
      icon:   calculator
      width:  0.2

  row_mode_and_purpose:
    - type:    plotly
      title:   Overall Trip Mode Share
      metric:  trip_mode_share
      height:  400
      width:   0.5
      scenarios: [activitysim-baseline, activitysim-density-variant, activitysim-transit-variant]
      traces:
        - type: bar
          x:    $metric.major_trip_mode
          y:    $metric.share
          name: $scenario
      layout:
        xaxis: { title: "Mode" }
        yaxis: { title: "Share of Trips", tickformat: ".1%" }
        showlegend: true

    - type:    plotly
      title:   Trip Purpose Breakdown
      metric:  trip_purpose_share
      height:  400
      width:   0.5
      scenarios: [activitysim-baseline, activitysim-density-variant, activitysim-transit-variant]
      traces:
        - type: bar
          x:    $metric.primary_purpose
          y:    $metric.share
          name: $scenario
      layout:
        xaxis: { title: "Purpose" }
        yaxis: { title: "Share of Trips", tickformat: ".1%" }
        showlegend: true

  # 031-all-panel-demo-content, User Story 1: the same real, already-real
  # trip_mode_share metric the Plotly panel above already renders, bound
  # to two more panel types — proves the new engines aren't a second data
  # source, purely a rendering-engine choice.
  row_mode_share_alt_engines:
    - type:       recharts
      title:      "Recharts — Overall Trip Mode Share"
      metric:     trip_mode_share
      chart_type: bar
      x:          major_trip_mode
      y:          share
      series:     scenario
      scenarios: [activitysim-baseline, activitysim-density-variant, activitysim-transit-variant]
      height:     400
      width:      0.5

    - type:    observable-plot
      title:   "Observable Plot — Overall Trip Mode Share"
      metric:  trip_mode_share
      scenarios: [activitysim-baseline, activitysim-density-variant, activitysim-transit-variant]
      mark:    barY
      x:       major_trip_mode
      y:       share
      fill:    scenario
      tip:     true
      grid:    true
      height:  400
      width:   0.5
