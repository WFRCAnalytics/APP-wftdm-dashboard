# 032-six-tab-demo-content — Trip Models tab. Sections match
# docs/CALIBRATION-SUMMARIES.md's own "Trip Models Tab" submodel
# headings exactly. Zone Trip Ends by Mode uses a zonemap — the natural
# fit for a spatial rollup (research.md §7).

header:
  tab: "Trip Models"
  title: Trip Models
  icon: map-pin

sections:
  - id: trip-purpose
    label: "Trip Purpose"
    rows: [row_trip_purpose]
  - id: trip-destination
    label: "Trip Destination"
    rows: [row_trip_destination]
  - id: trip-scheduling
    label: "Trip Scheduling"
    rows: [row_trip_scheduling]
  - id: zone-trip-ends
    label: "Zone Trip Ends by Mode"
    rows: [row_zone_trip_ends]

layout:
  # Already real, already published (026) — reused unmodified.
  row_trip_purpose:
    - type:       table
      title:      "Trip Purpose Breakdown"
      metric:     trip_purpose_share
      scenario:   activitysim-baseline
      sort:       { column: trips, order: desc }
      pagination: 20
      columns:
        - { field: primary_purpose, label: "Purpose" }
        - { field: trips,           label: "Trips", format: ",.0f" }
        - { field: share,           label: "Share", format: ".1%" }
      width: 1.0

  row_trip_destination:
    - type:    observable-plot
      title:   "Trip Destination Distance Distribution"
      metric:  trip_destination_summary
      scenario: activitysim-baseline
      mark:    barY
      x:       distance_bin
      y:       trips
      fill:    primary_purpose
      tip:     true
      grid:    true
      height:  450
      width:   1.0

  # Filtered to work trips specifically — a clean, single-purpose
  # departure-hour histogram.
  row_trip_scheduling:
    - type:    plotly
      title:   "Trip Departure Hour (Work Trips)"
      metric:  trip_scheduling
      scenario: activitysim-baseline
      filter:  { primary_purpose: work }
      height:  400
      width:   1.0
      traces:
        - type: bar
          x:    $metric.depart_hour
          y:    $metric.trips
      layout:
        xaxis: { title: "Departure Hour" }
        yaxis: { title: "Trips" }

  # Spatial rollup — real production/attraction trip ends by zone,
  # filtered to one clean, well-defined choropleth (attraction end, SOV
  # mode), matching this repo's own established zonemap filter
  # convention (dashboard-6-network.yaml's own "Work Trips by Destination
  # Zone" panel).
  row_zone_trip_ends:
    - type:       zonemap
      title:      "SOV Trip Attractions by Zone"
      metric:     trip_ends_by_zone_mode
      scenario:   activitysim-baseline
      filter:     { trip_end: attraction, major_trip_mode: SOV }
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     zone_id
      column:     trips
      label:      "SOV Attractions"
      color_scale: sequential
      color_ramp:  YlOrRd
      steps:       7
      height:  500
      width:   1.0
      center: [-122.402, 37.787]
      zoom:   13
