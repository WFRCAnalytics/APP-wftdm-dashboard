# 040-test-suite-migration — the broken-panel / edge-case test dashboard.
#
# PERMANENT 8th entry in public/demo-dashboard-config/index.json — present
# in every build (local dev, production, GitHub Pages). It is NOT hidden
# from real users by conditional registration; it is kept out of the way
# purely by a near-invisible sidebar label:
#   - header.tab is a single space " " (a real, valid non-empty string —
#     parseDashboardConfig requires non-empty — that renders as a barely
#     visible sliver among the seven real tabs);
#   - header.icon is omitted entirely (no glyph);
#   - header.aria_label gives keyboard / screen-reader users a real name
#     ("Test"), wired as the sidebar button's aria-label so
#     getByRole('tab', { name: 'Test' }) resolves it.
#
# Every panel binds to a REAL demo scenario/metric and produces its error
# / empty state through CONFIG SHAPE ALONE — no synthetic Parquet (FR-005).
# Sentinel strings (__nonexistent_metric__, __no_such_purpose__,
# totally-made-up-preset-name, __nope_*__) are confirmed absent from the
# real demo Parquet columns/values and from src/panels/basemap/registry.ts.
#
# Panel inventory maps 1:1 to specs/040-test-suite-migration/contracts/
# dashboard-8-test.md. See that contract for the expected UI state per row.

header:
  tab: " "
  title: "Test / Broken Panels"
  aria_label: "Test"
  # full_page + more than one panel below ⇒ the deliberate misconfiguration
  # case: dashboardLayout.ts's findFullPagePanel() finds no single panel,
  # so the app console.warns and falls back to ordinary card-grid
  # rendering (030 behavior). This is the fullPagePanel.spec.ts
  # misconfiguration coverage, expressed statically.
  full_page: true

layout:
  # ── Missing metric → Catalog Error / "Couldn't load…" (one per type) ──
  row_missing_metric:
    - type:   table
      title:  "Broken Table Panel (missing metric)"
      metric: __nonexistent_metric__
      columns:
        - { field: scenario, label: "Scenario" }
        - { field: trips,    label: "Trips" }
      width: 0.5

    - type:  plotly
      title: "Broken Plotly Panel (missing metric)"
      metric: __nonexistent_metric__
      traces:
        - { type: bar, x: $metric.x, y: $metric.y, name: $scenario }
      width: 0.5

  row_missing_metric_2:
    - type:   sankey
      title:  "Broken Sankey Panel (missing metric)"
      metric: __nonexistent_metric__
      source: a
      target: b
      value:  v
      width:  0.34

    - type:   recharts
      title:  "Broken Recharts Panel (missing metric)"
      metric: __nonexistent_metric__
      chart_type: bar
      x: k
      y: v
      width: 0.33

    - type:   observable-plot
      title:  "Broken Observable Plot Panel (missing metric)"
      metric: __nonexistent_metric__
      mark:   barY
      x:      k
      y:      v
      width:  0.33

  row_missing_metric_maps:
    - type:      flowmap
      title:     "Broken Flow Map Panel (missing metric)"
      metric:    __nonexistent_metric__
      origin:      o
      origin_lat:  olat
      origin_lon:  olon
      destination: d
      dest_lat:    dlat
      dest_lon:    dlon
      value:       v
      height: 320
      width:  0.5

    - type:      zonemap
      title:     "Broken Zone Map Panel (missing metric)"
      metric:    __nonexistent_metric__
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     zone_id
      column:        v
      height: 320
      width:  0.5

  # ── Invalid chart_type → runtime validation error before any query ──
  row_bad_chart_type:
    - type:   recharts
      title:  "Recharts Invalid Chart Type (pie)"
      metric: trip_mode_share
      scenario: activitysim-baseline
      chart_type: pie
      x: major_trip_mode
      y: share
      width: 1.0

  # ── Unreachable basemap preset → blank-style fallback, data still draws ──
  row_bad_basemap:
    - type:      flowmap
      title:     "Flowmap Unreachable Basemap"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   totally-made-up-preset-name
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  0.5

    - type:      zonemap
      title:     "Zone Map Unreachable Basemap"
      metric:    vmt_by_home_taz
      scenario:  activitysim-baseline
      basemap:   totally-made-up-preset-name
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        total_vmt
      color_scale: sequential
      color_ramp:  YlOrRd
      steps:       7
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  0.5

  # ── Composition layer at an unreachable URL → whole basemap falls back ──
  row_broken_composition:
    - type:      flowmap
      title:     "Flowmap Broken Composition Layer"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:
        layers:
          - "https://invalid.example.invalid/style-does-not-exist.json"
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  1.0

  # ── graphic-walker: bad dataset (fixed) + bad dataset (with picker) ──
  row_bad_gw_dataset:
    - type:    graphic-walker
      title:   "Explore Panel Broken (missing dataset)"
      dataset: __nonexistent_dataset__
      width:   0.5

    - type:    graphic-walker
      title:   "Explore Panel Broken (Dataset Picker, No Match)"
      dataset: __nonexistent_dataset__
      dataset_picker: true
      width:   0.5

  # ── graphic-walker: a real dataset, expandable — restores the 004
  #    expand-mechanism coverage graphicWalkerPanel.spec.ts US3 needs
  #    (034 moved the default so graphic-walker is not expandable
  #    without this explicit override). ──
  row_gw_expandable:
    - type:    graphic-walker
      title:   "Free-form Visual Analytics (expandable)"
      dataset: trip_mode_share
      scenario: activitysim-baseline
      expandable: true
      width:   1.0

  # ── markdown: XSS payload / empty / whitespace-only ──
  row_markdown_edge:
    - type:  markdown
      title: "Markdown XSS Payload (must be sanitized)"
      width: 0.34
      content: |
        ## Sanitized Heading
        <script>window.__xss_fired = true</script>
        <img src="x" onerror="window.__xss_fired = true" />
        [ok link](https://example.com)

    - type:  markdown
      title: "Markdown Empty Content"
      content: ""
      width: 0.33

    - type:  markdown
      title: "Markdown Whitespace Only"
      content: "   "
      width: 0.33

  # ── valuebox: sparkline / baseline_trend referencing a missing metric ──
  row_valuebox_edge:
    - type:   valuebox
      title:  "Value Box — Broken Sparkline"
      metric: summary_kpis
      scenario: activitysim-baseline
      column: total_trips
      format: "{:,.0f}"
      sparkline:
        metric: __nonexistent_metric__
        x: k
        y: v
      width: 0.5

    - type:   valuebox
      title:  "Value Box — Broken Baseline Trend"
      metric: summary_kpis
      scenario: activitysim-baseline
      column: total_trips
      format: "{:,.0f}"
      baseline_trend:
        expr: "a.__missing_col__ - b.total_persons"
      width: 0.5

  # ── comparison: diff whose a/b name unresolvable scenarios ──
  row_bad_diff:
    - type:   table
      title:  "Broken Comparison Diff (unresolvable a/b)"
      metric: trip_purpose_share
      comparison:
        type: diff
        a: __nope_a__
        b: __nope_b__
        expr: "a.trips - b.trips"
      compare_on: [primary_purpose]
      columns:
        - { field: primary_purpose, label: "Purpose" }
        - { field: trips,           label: "Δ Trips" }
      # 040-test-suite-migration (panelExpand.spec.ts): table is
      # expandable by TYPE default — this explicit override proves a
      # per-panel `expandable: false` wins over that default (the "opts
      # OUT" half of panelExpand.spec.ts's own override test; row_missing_
      # metric's own "Broken Table Panel" — no override — is the sibling
      # "opts don't override, stays expandable" half of the same test).
      expandable: false
      width: 1.0

  # ── Zero-row filter → empty state (value confirmed absent from real data) ──
  row_empty_result:
    - type:   recharts
      title:  "Recharts Empty Result"
      metric: trip_mode_share
      scenario: activitysim-baseline
      filter: { major_trip_mode: __no_such_mode__ }
      chart_type: bar
      x: major_trip_mode
      y: share
      width: 0.5

    - type:    graphic-walker
      title:   "Free-form Visual Analytics Empty"
      dataset: trip_mode_share
      scenario: activitysim-baseline
      filter:  { major_trip_mode: __no_such_mode__ }
      width:   0.5

  # ── Basemap precedence: panel with / without its own basemap under a
  #    tab-level default_basemap (panel > tab > global > app-default) ──
  row_basemap_precedence:
    - type:      flowmap
      title:     "Basemap Precedence — inherits tab default"
      metric:    od_flows
      scenario:  activitysim-baseline
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

    - type:      flowmap
      title:     "Basemap Precedence — panel override wins"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   openfreemap-positron
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

default_basemap: carto-positron
