# 040-test-suite-migration — the broken-panel / edge-case test dashboard.
#
# PERMANENT 8th entry in public/demo-dashboard-config/index.json — present
# in every build (local dev, production, GitHub Pages). It is NOT hidden
# from real users by conditional registration; it is kept out of the way
# purely by a near-invisible sidebar label:
#   - header.tab is a single space " " (a real, valid non-empty string —
#     parseDashboardConfig requires non-empty — that renders as a barely
#     visible sliver among the seven real tabs);
#   - header.icon is omitted entirely (no glyph);
#   - header.aria_label gives keyboard / screen-reader users a real name
#     ("Test"), wired as the sidebar button's aria-label so
#     getByRole('tab', { name: 'Test' }) resolves it.
#
# Every panel binds to a REAL demo scenario/metric and produces its error
# / empty state through CONFIG SHAPE ALONE — no synthetic Parquet (FR-005).
# Sentinel strings (__nonexistent_metric__, __no_such_purpose__,
# totally-made-up-preset-name, __nope_*__) are confirmed absent from the
# real demo Parquet columns/values and from src/panels/basemap/registry.ts.
#
# Panel inventory maps 1:1 to specs/040-test-suite-migration/contracts/
# dashboard-8-test.md. See that contract for the expected UI state per row.

header:
  tab: " "
  title: "Test / Broken Panels"
  aria_label: "Test"
  # full_page + more than one panel below ⇒ the deliberate misconfiguration
  # case: dashboardLayout.ts's findFullPagePanel() finds no single panel,
  # so the app console.warns and falls back to ordinary card-grid
  # rendering (030 behavior). This is the fullPagePanel.spec.ts
  # misconfiguration coverage, expressed statically.
  full_page: true

layout:
  # ── Missing metric → Catalog Error / "Couldn't load…" (one per type) ──
  row_missing_metric:
    - type:   table
      title:  "Broken Table Panel (missing metric)"
      metric: __nonexistent_metric__
      columns:
        - { field: scenario, label: "Scenario" }
        - { field: trips,    label: "Trips" }
      width: 0.5

    - type:  plotly
      title: "Broken Plotly Panel (missing metric)"
      metric: __nonexistent_metric__
      traces:
        - { type: bar, x: $metric.x, y: $metric.y, name: $scenario }
      width: 0.5

  row_missing_metric_2:
    - type:   sankey
      title:  "Broken Sankey Panel (missing metric)"
      metric: __nonexistent_metric__
      source: a
      target: b
      value:  v
      width:  0.34

    - type:   recharts
      title:  "Broken Recharts Panel (missing metric)"
      metric: __nonexistent_metric__
      chart_type: bar
      x: k
      y: v
      width: 0.33

    - type:   observable-plot
      title:  "Broken Observable Plot Panel (missing metric)"
      metric: __nonexistent_metric__
      mark:   barY
      x:      k
      y:      v
      width:  0.33

  row_missing_metric_maps:
    - type:      flowmap
      title:     "Broken Flow Map Panel (missing metric)"
      metric:    __nonexistent_metric__
      origin:      o
      origin_lat:  olat
      origin_lon:  olon
      destination: d
      dest_lat:    dlat
      dest_lon:    dlon
      value:       v
      height: 320
      width:  0.5

    - type:      zonemap
      title:     "Broken Zone Map Panel (missing metric)"
      metric:    __nonexistent_metric__
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     zone_id
      column:        v
      height: 320
      width:  0.5

  # ── Invalid chart_type → runtime validation error before any query ──
  row_bad_chart_type:
    - type:   recharts
      title:  "Recharts Invalid Chart Type (pie)"
      metric: trip_mode_share
      scenario: activitysim-baseline
      chart_type: pie
      x: major_trip_mode
      y: share
      width: 1.0

  # ── 040-test-suite-migration (rechartsPanel.spec.ts, Batch B): real
  #    working bar/line/area panels — 057-observable-plot-conversion
  #    moved every real recharts panel out of the actual demo tabs, so
  #    this panel type's own real mechanics (per-series --chart-N
  #    coloring, legend, tooltip, theming) have no home left in real
  #    calibration content. Per direct user decision, that content lives
  #    here instead — the same "exercises a panel type's own mechanics,
  #    not part of the real calibration story" role this tab already
  #    serves for sankeyPanel.spec.ts's own recent addition.
  #
  #    Bar: trip_purpose_share has exactly 10 real primary_purpose values,
  #    every one a single word with no space (confirmed live via the
  #    duckdb CLI) — x/series on the SAME real column gives one bar per
  #    purpose, each its own real --chart-N color, cycling through the 5
  #    tokens twice. A real, confirmed, CONFIRMED-AVOIDED bug shaped this
  #    choice: trip_mode_share's own major_trip_mode domain (the first
  #    real candidate tried) includes "Ride Hail" — a real category value
  #    containing a literal space — and components/ui/chart.tsx's own
  #    `ChartStyle` emits `--color-${key}: ...;` verbatim (confirmed via
  #    direct source read); a raw space inside a CSS custom-property name
  #    is invalid, so that one specific series' color declaration fails to
  #    parse and its bar renders pure black (confirmed live: the OTHER 4
  #    modes' bars resolved real --chart-N colors correctly, only "Ride
  #    Hail"'s came back rgb(0,0,0)). A real, confirmed, out-of-scope
  #    app-level gap (chart.tsx is a verbatim shadcn-CLI file this project
  #    already keeps pristine by convention) — not fixed here; this
  #    migration's own established discipline is to choose real data that
  #    doesn't trigger an unrelated, pre-existing bug, not to fix
  #    application code from inside a test-migration task. Every real
  #    primary_purpose value is a single word, so this metric avoids the
  #    trigger entirely while still proving real per-series coloring.
  row_recharts_charts:
    - type:   recharts
      title:  "Recharts Mode Breakdown (Bar)"
      metric: trip_purpose_share
      scenario: activitysim-baseline
      chart_type: bar
      x: primary_purpose
      series: primary_purpose
      y: share
      width: 0.34

    # Line: trip_destination_summary (primary_purpose x distance_bin) has
    # 10 real purposes, confirmed live — no `filter:` (this grammar only
    # supports one exact-match value, not a list) narrows it to a smaller
    # "2 series" shape, so this uses the real, full 10-series set instead.
    # A genuinely MORE thorough real test than the retired fixture's own
    # fabricated 2-series version: 10 series cycling through 5 --chart-N
    # tokens twice proves real token wraparound, never exercised before.
    # Real bin coverage differs per purpose (work: 5 bins 0.0-2.0;
    # shopping: 4 bins 0.0-1.5; univ: 3 bins 0.0-1.0 — confirmed live) —
    # a genuine no-data gap for some (x, series) pairs, exactly the real
    # case rechartsEncoding.ts's own "never coerced to 0" contract exists
    # for. `y: avg_distance_miles`, NOT `trips` — a second real, confirmed,
    # out-of-scope bug found and avoided: `trips` is a COUNT(*)-derived
    # BIGINT (the same already-documented DuckDB-WASM bigint-vs-number gap
    # CLAUDE.md records for `formatValue.ts`/`ZoneMapPanel.tsx`), and
    # Recharts' own internal geometry/scale computation cannot handle a
    # raw JS `bigint` value — confirmed live: with `y: trips`, the legend
    # and axes rendered correctly but ZERO `<path>` elements of any kind
    # appeared anywhere in the chart (not just `.recharts-line-curve`).
    # `avg_distance_miles` is a real `DOUBLE` column (confirmed via
    # `DESCRIBE`), unaffected, and a more natural fit for a "Trip Length
    # Frequency" panel's own real y-axis than a raw trip count anyway.
    - type:   recharts
      title:  "Recharts Trip Length Frequency (Line)"
      metric: trip_destination_summary
      scenario: activitysim-baseline
      chart_type: line
      x: distance_bin
      series: primary_purpose
      y: avg_distance_miles
      width: 0.33

    # Area: same real metric, filtered to ONE real purpose (`work`, which
    # has all 5 real bins 0.0-2.0) — the single-series case (no `series`
    # key), --chart-1 only. Same `avg_distance_miles` choice as the line
    # panel above, for the same real, confirmed bigint reason.
    - type:   recharts
      title:  "Recharts Trip Length Frequency (Area)"
      metric: trip_destination_summary
      scenario: activitysim-baseline
      chart_type: area
      filter: { primary_purpose: work }
      x: distance_bin
      y: avg_distance_miles
      width: 0.33

  # ── Regression proof: the real space-in-category-value bug the two
  #    comments above document as "confirmed, out-of-scope, not fixed
  #    here" WAS subsequently fixed at its root (a follow-up request,
  #    same 040-test-suite-migration lineage) — components/ui/chart.tsx's
  #    `ChartStyle` and RechartsPanel.tsx's own `var(--color-${key})`
  #    references now both slugify the key via the newly-exported
  #    `sanitizeColorKey()` before using it in a CSS custom-property name,
  #    while the real, unslugged "Ride Hail" label stays exactly what
  #    renders in the legend/tooltip/dataKey binding. This panel uses the
  #    ORIGINAL real data source the bug was found on and then avoided
  #    (trip_mode_share, real major_trip_mode values SOV/HOV/Transit/
  #    Non-Motorized/"Ride Hail") — proving the fix against the actual
  #    trigger, not a data source chosen to route around it. See
  #    PIPELINE.md's own recorded finding for the full account.
  row_recharts_space_in_category:
    - type:   recharts
      title:  "Recharts Mode Share (Bar, Space in Category Value)"
      metric: trip_mode_share
      scenario: activitysim-baseline
      chart_type: bar
      x: major_trip_mode
      series: major_trip_mode
      y: share
      width: 1.0

  # ── 040-test-suite-migration (rechartsPanel.spec.ts, Batch B): a real,
  #    working, legend-bearing Plotly panel — confirmed live (grep sweep)
  #    that ZERO real `type: plotly` panels exist anywhere in demo
  #    content any more (057 moved every real one to Observable Plot;
  #    the only other `plotly` panel in this whole app is this tab's own
  #    broken missing-metric one). rechartsPanel.spec.ts's own legend-
  #    click-to-toggle regression test (FR-010: adding the recharts
  #    registry entry must never affect Plotly's own existing legend
  #    behavior) needs a real, multi-trace, legend-bearing Plotly panel
  #    to prove that against — plotlyTraces.ts's own `color: $metric.<col>`
  #    split (confirmed via direct source read) splits one trace
  #    declaration into one real Plotly trace per distinct value of that
  #    column, each Plotly's own default-palette color and its own real
  #    legend entry. Uses trip_mode_share (5 real modes, including "Ride
  #    Hail") DELIBERATELY, not trip_purpose_share — Plotly assigns trace
  #    colors from its own internal default palette, never via a CSS
  #    custom-property name derived from the category string, so it has
  #    no exposure to the real, confirmed chart.tsx space-in-`--color-`
  #    bug the recharts bar panel above had to route around.
  row_plotly_legend:
    - type:   plotly
      title:  "Plotly Mode Share (Bar)"
      metric: trip_mode_share
      scenario: activitysim-baseline
      traces:
        - { type: bar, x: $metric.major_trip_mode, y: $metric.share, color: $metric.major_trip_mode }
      width: 1.0

  # ── Unreachable basemap preset → blank-style fallback, data still draws ──
  row_bad_basemap:
    - type:      flowmap
      title:     "Flowmap Unreachable Basemap"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   totally-made-up-preset-name
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  0.5

    - type:      zonemap
      title:     "Zone Map Unreachable Basemap"
      metric:    vmt_by_home_taz
      scenario:  activitysim-baseline
      basemap:   totally-made-up-preset-name
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        total_vmt
      color_scale: sequential
      color_ramp:  YlOrRd
      steps:       7
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  0.5

  # ── Composition layer at an unreachable URL → whole basemap falls back ──
  row_broken_composition:
    - type:      flowmap
      title:     "Flowmap Broken Composition Layer"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:
        layers:
          - "https://invalid.example.invalid/style-does-not-exist.json"
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 360
      width:  1.0

  # ── graphic-walker: bad dataset (fixed) + bad dataset (with picker) ──
  row_bad_gw_dataset:
    - type:    graphic-walker
      title:   "Explore Panel Broken (missing dataset)"
      dataset: __nonexistent_dataset__
      width:   0.5

    - type:    graphic-walker
      title:   "Explore Panel Broken (Dataset Picker, No Match)"
      dataset: __nonexistent_dataset__
      dataset_picker: true
      width:   0.5

  # ── graphic-walker: a real dataset, expandable — restores the 004
  #    expand-mechanism coverage graphicWalkerPanel.spec.ts US3 needs
  #    (034 moved the default so graphic-walker is not expandable
  #    without this explicit override). ──
  row_gw_expandable:
    - type:    graphic-walker
      title:   "Free-form Visual Analytics (expandable)"
      dataset: trip_mode_share
      scenario: activitysim-baseline
      expandable: true
      width:   1.0

  # ── markdown: XSS payload / empty / whitespace-only ──
  row_markdown_edge:
    - type:  markdown
      title: "Markdown XSS Payload (must be sanitized)"
      width: 0.34
      content: |
        This paragraph is legitimate markdown and should render normally.

        ## Sanitized Heading
        <script>window.__xss_fired = true</script>
        <img src="x" onerror="window.__xss_fired = true" />
        [ok link](https://example.com)

        This paragraph comes after the unsafe fragments and should also render.

    - type:  markdown
      title: "Markdown Empty Content"
      content: ""
      width: 0.33

    - type:  markdown
      title: "Markdown Whitespace Only"
      content: "   "
      width: 0.33

  # ── valuebox: sparkline / baseline_trend referencing a missing metric ──
  row_valuebox_edge:
    - type:   valuebox
      title:  "Value Box — Broken Sparkline"
      metric: summary_kpis
      scenario: activitysim-baseline
      column: total_trips
      format: "{:,.0f}"
      sparkline:
        metric: __nonexistent_metric__
        x: k
        y: v
      width: 0.5

    - type:   valuebox
      title:  "Value Box — Broken Baseline Trend"
      metric: summary_kpis
      scenario: activitysim-baseline
      column: total_trips
      format: "{:,.0f}"
      baseline_trend:
        expr: "a.__missing_col__ - b.total_persons"
      width: 0.5

  # ── comparison: diff whose a/b name unresolvable scenarios ──
  row_bad_diff:
    - type:   table
      title:  "Broken Comparison Diff (unresolvable a/b)"
      metric: trip_purpose_share
      comparison:
        type: diff
        a: __nope_a__
        b: __nope_b__
        expr: "a.trips - b.trips"
      compare_on: [primary_purpose]
      columns:
        - { field: primary_purpose, label: "Purpose" }
        - { field: trips,           label: "Δ Trips" }
      # 040-test-suite-migration (panelExpand.spec.ts): table is
      # expandable by TYPE default — this explicit override proves a
      # per-panel `expandable: false` wins over that default (the "opts
      # OUT" half of panelExpand.spec.ts's own override test; row_missing_
      # metric's own "Broken Table Panel" — no override — is the sibling
      # "opts don't override, stays expandable" half of the same test).
      expandable: false
      width: 1.0

  # ── Zero-row filter → empty state (value confirmed absent from real data) ──
  row_empty_result:
    - type:   recharts
      title:  "Recharts Empty Result"
      metric: trip_mode_share
      scenario: activitysim-baseline
      filter: { major_trip_mode: __no_such_mode__ }
      chart_type: bar
      x: major_trip_mode
      y: share
      width: 0.34

    - type:    graphic-walker
      title:   "Free-form Visual Analytics Empty"
      dataset: trip_mode_share
      scenario: activitysim-baseline
      filter:  { major_trip_mode: __no_such_mode__ }
      width:   0.33

    # 040-test-suite-migration (T023): sankeyPanel.spec.ts's own
    # zero-row-filter PanelEmptyState case — same literal-non-placeholder-
    # filter convention as the two siblings above. __no_such_purpose__ is
    # confirmed absent from the real primary_purpose domain (this file's
    # own header comment already names it as a confirmed-absent sentinel).
    - type:   sankey
      title:  "Sankey Empty Result"
      metric: purpose_mode_flow
      scenario: activitysim-baseline
      filter: { primary_purpose: __no_such_purpose__ }
      source: primary_purpose
      target: major_trip_mode
      value:  trips
      width:  0.33

  # ── Basemap precedence: panel with / without its own basemap under a
  #    tab-level default_basemap (panel > tab > global > app-default) ──
  row_basemap_precedence:
    - type:      flowmap
      title:     "Basemap Precedence — inherits tab default"
      metric:    od_flows
      scenario:  activitysim-baseline
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

    - type:      flowmap
      title:     "Basemap Precedence — panel override wins"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   openfreemap-positron
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

  # ── 040-test-suite-migration: an author-configured view deliberately
  #    far from the real data's own extent (real od_flows spans roughly
  #    lon -112.0..-111.75 / lat 40.6..40.85, the Wasatch Front) — proves
  #    an explicit center/zoom always wins outright over auto-fit. ──
  row_explicit_view:
    - type:      flowmap
      title:     "Flowmap Explicit View Override"
      metric:    od_flows
      scenario:  activitysim-baseline
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-110.0, 39.0]
      zoom:   6
      height: 320
      width:  1.0

  # ── 040-test-suite-migration: a real leaflet-providers raster preset
  #    (OpenTopoMap) — extends basemap coverage to the third source
  #    category (vector preset / composition / raster). ──
  row_raster_provider:
    - type:      flowmap
      title:     "Flowmap Raster Provider Preset"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   OpenTopoMap
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  1.0

  # ── 040-test-suite-migration: real UGRC multi-source compositions
  #    (Utah's own GIS agency) — the app's own most elaborate real
  #    basemap-composition case (2 stacked vector sources, sprite/glyph
  #    resolution, highway-shield icon coverage). ──
  row_ugrc_composition:
    - type:      flowmap
      title:     "Flowmap UGRC Composition"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   ugrc-vector-lite
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

    - type:      flowmap
      title:     "Flowmap UGRC Outdoors Composition"
      metric:    od_flows
      scenario:  activitysim-baseline
      basemap:   ugrc-vector-outdoors
      origin:      orig_taz
      origin_lat:  orig_lat
      origin_lon:  orig_lon
      destination: dest_taz
      dest_lat:    dest_lat
      dest_lon:    dest_lon
      value:       trips
      center: [-122.402, 37.787]
      zoom:   11
      height: 320
      width:  0.5

  # ── 040-test-suite-migration (T025): zonemap analogs of the real
  #    basemap-precedence/no-view pair authored for flowmap above — real
  #    vmt_by_home_taz/activitysim-baseline, real taz25.geoparquet
  #    boundaries. "Zone Map Tab Default Basemap" deliberately has NO
  #    basemap/center/zoom, serving both the auto-fit-to-geometry test
  #    (User Story 1) and the tab-default-basemap-inheritance test (User
  #    Story 2) — the same dual role the retired 8-zone fixture's own
  #    identically-named panel served. ──
  row_zonemap_basemap_precedence:
    - type:          zonemap
      title:         "Zone Map Tab Default Basemap"
      metric:        vmt_by_home_taz
      scenario:      activitysim-baseline
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        total_vmt
      color_scale:   sequential
      color_ramp:    YlOrRd
      steps:         7
      height: 320
      width:  0.5

    - type:          zonemap
      title:         "Zone Map Panel Basemap Override"
      metric:        vmt_by_home_taz
      scenario:      activitysim-baseline
      basemap:       openfreemap-positron
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        total_vmt
      color_scale:   sequential
      color_ramp:    YlOrRd
      steps:         7
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  0.5

  # ── 040-test-suite-migration (T025): a real explicit `domain:` —
  #    real vmt_by_home_taz auto-computes to [14.14, 1911.40] (the real
  #    Network-tab panel's own domain, no config needed there); this
  #    panel deliberately configures a DIFFERENT, wider domain ([0, 2000])
  #    to prove an author-configured domain is honored verbatim, not
  #    silently replaced by the auto-computed one. ──
  row_zonemap_explicit_domain:
    - type:          zonemap
      title:         "Zone Map Explicit Domain"
      metric:        vmt_by_home_taz
      scenario:      activitysim-baseline
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        total_vmt
      color_scale:   sequential
      color_ramp:    YlOrRd
      steps:         7
      domain:        [0, 2000]
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  1.0

  # ── 040-test-suite-migration (T025): a real, confirmed scope correction,
  #    found live (not assumed) during this migration's own
  #    implementation. vmt_by_home_taz has no purpose dimension at all
  #    (summarize.yaml — a plain GROUP BY home_zone_id) and covers all 25
  #    real zones in every scenario, so it cannot drive a real no-data
  #    zone at all. trips_by_destination_zone (destination_zone_id ×
  #    primary_purpose, already real, already published) DOES have a real
  #    gap — confirmed live: filtering to `school` leaves real TAZ 14
  #    with zero destination trips (24 of 25 zones covered) — the real
  #    no-data trigger this migration's own investigation found, replacing
  #    the retired fixture's synthetic "TAZ 800 always no-data" case.
  #    Deliberately a HARDCODED `filter:` value (`primary_purpose:
  #    school`), matching this project's own two other already-real
  #    zonemap/panel `filter:` usages (dashboard-3-tour-models.yaml,
  #    dashboard-5-trip-models.yaml) — NOT a `$filters.purpose` global
  #    sidebar reference. A live attempt at the latter confirmed a real,
  #    broader finding: `state/filterState.ts`'s `get()` returns
  #    `undefined` until some real UI control calls `set()` first, and
  #    zero real sidebar filter controls exist anywhere in this demo
  #    (grep-confirmed) — a `$filters.purpose`-bound panel would throw
  #    "unresolved placeholder" on every real page load, not just in an
  #    unmigrated test, so it was never a viable real-content choice here.
  #    The filter-REACTIVITY test itself (changing a global filter
  #    re-colors this panel) is retired for the same reason
  #    dashboardShell.spec.ts/panelExpand.spec.ts/flowmapPanel.spec.ts
  #    already retired theirs: zero real content anywhere uses global
  #    filter reactivity. ──
  row_zonemap_filter_reactive:
    - type:          zonemap
      title:         "Zone Map Destination Trips by Purpose"
      metric:        trips_by_destination_zone
      scenario:      activitysim-baseline
      filter:        { primary_purpose: school }
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     destination_zone_id
      column:        trips
      color_scale:   sequential
      color_ramp:    YlOrRd
      steps:         7
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  1.0

  # ── 040-test-suite-migration (T025): comparison: diff on real data.
  #    A real, confirmed correction made during this migration's own
  #    implementation: trips_by_destination_zone (destination_zone_id ×
  #    primary_purpose) has MULTIPLE rows per zone — comparison: diff's
  #    own JOIN is on `compare_on` columns ALONE (destination_zone_id
  #    here), so joining that metric without ALSO including
  #    primary_purpose in compare_on produces a real cross-product over
  #    purposes per zone, not one clean per-zone diff (confirmed live:
  #    the resulting values didn't match a direct GROUP BY/SUM
  #    cross-check at all). vmt_by_home_taz has exactly ONE row per
  #    zone per scenario (a plain GROUP BY home_zone_id, no further
  #    split) and is genuinely diff-compatible with no such risk — real,
  #    confirmed per-zone diffs (activitysim-density-variant minus
  #    activitysim-baseline, home_zone_id): TAZ 22 = 396.38-402.97 =
  #    -6.58 (real min), TAZ 8 = 1301.66-1281.89 = +19.76 (real max) —
  #    genuine sign variation for the diverging scale, replacing the
  #    retired fixture's synthetic "TAZ 300 exactly at midpoint" case
  #    (no real zone lands exactly at zero here — TAZ 19 comes closest
  #    at +0.01 — so this test asserts real sign/magnitude at the two
  #    real extremes instead of a contrived exact-zero zone). ──
  row_zonemap_diff:
    - type:        zonemap
      title:       "Zone Map VMT Diff (Density vs Baseline)"
      metric:      vmt_by_home_taz
      comparison:
        type: diff
        a:    activitysim-density-variant
        b:    activitysim-baseline
        expr: "a.total_vmt - b.total_vmt"
      compare_on:    [home_zone_id]
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        diff_value
      color_scale:   diverging
      color_ramp:    RdBu
      domain:        [-10, 25]
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  0.5

    - type:        zonemap
      title:       "Zone Map Diff Unresolvable Scenario"
      metric:      vmt_by_home_taz
      comparison:
        type: diff
        a:    __nope_a__
        b:    __nope_b__
        expr: "a.total_vmt - b.total_vmt"
      compare_on:    [home_zone_id]
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        diff_value
      color_scale:   diverging
      color_ramp:    RdBu
      domain:        [-10, 25]
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  0.5

  # ── 019-baseline-diff-consumption: the $baseline sentinel, real data.
  #    activitysim-baseline is auto-baseline until a test explicitly
  #    changes it (038's own automatic-default rule) — so this panel
  #    initially renders a===b (trivial 0 everywhere) exactly like the
  #    retired fixture's own DIFF_BASELINE_TITLE did. ──
  row_zonemap_diff_baseline:
    - type:        zonemap
      title:       "Zone Map VMT Diff via $baseline"
      metric:      vmt_by_home_taz
      comparison:
        type: diff
        a:    activitysim-baseline
        b:    "$baseline"
        expr: "a.total_vmt - b.total_vmt"
      compare_on:    [home_zone_id]
      boundaries:    taz25.geoparquet
      boundaries_id: TAZ1454
      metric_id:     home_zone_id
      column:        diff_value
      color_scale:   diverging
      color_ramp:    RdBu
      domain:        [-10, 25]
      center: [-122.402, 37.787]
      zoom:   13
      height: 320
      width:  1.0

default_basemap: carto-positron
