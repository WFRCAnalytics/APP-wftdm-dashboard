# 032-six-tab-demo-content — Mode Choice tab. Sections match
# project-docs/CALIBRATION-SUMMARIES.md's own "Mode Choice Tab" submodel
# headings exactly. Folds in the real purpose_mode_flow Sankey panel
# from the now-dissolved dashboard-6-flows.yaml (research.md §6, FR-011)
# under Trip Mode Choice, alongside the already-real, already-published
# trip_mode_share/mode_share_by_period metrics.

header:
  tab: "Mode Choice"
  title: Mode Choice
  icon: shuffle

sections:
  - id: tour-mode-choice
    label: "Tour Mode Choice"
    rows: [row_tour_mode_choice]
  - id: atwork-subtour-mode-choice
    label: "At-Work Subtour Mode Choice"
    rows: [row_atwork_subtour_mode]
  - id: trip-mode-choice
    label: "Trip Mode Choice"
    rows: [row_trip_mode_flow, row_trip_mode_by_period]

layout:
  row_tour_mode_choice:
    - type:       table
      title:      "Tour Mode Share by Segment"
      metric:     tour_mode_share_summary
      sort:       { column: tours, order: desc }
      pagination: 25
      searchable: true
      columns:
        # 038-all-loaded-scenarios: unpinned — the $scenario union adds this
        # discriminator column so the table reads as a per-scenario comparison.
        - { field: scenario, label: "Scenario" }
        - { field: primary_purpose,   label: "Tour Purpose" }
        - { field: tour_mode,         label: "Mode" }
        - { field: auto_sufficiency,  label: "Auto Sufficiency" }
        - { field: person_type,       label: "Person Type" }
        - { field: sex,               label: "Sex" }
        - { field: income_group,      label: "Income Group" }
        - { field: tours,             label: "Tours", format: ",.0f" }
      width: 1.0

  row_atwork_subtour_mode:
    - type:       observable-plot
      title:      "At-Work Subtour Mode Share by Purpose"
      metric:     atwork_subtour_mode_summary
      # 038: stays pinned — `fill` is committed to the mode split (057-
      # observable-plot-conversion: converted from recharts; faceting to
      # also compare scenarios is a real, available Observable Plot
      # strength but deferred to this feature's own explicitly later
      # polish effort, contracts/panel-conversions.md). Scope stated
      # below; the other Mode Choice panels compare scenarios.
      scenario:   activitysim-baseline
      description: "Baseline scenario, split by mode. Compare runs on the other Mode Choice panels via the Scenarios tab."
      mark:       barY
      x:          primary_purpose
      y:          tours
      fill:       tour_mode
      tip:        true
      grid:       true
      height:     400
      width:      1.0

  # Real trip counts flowing from purpose to grouped mode — the same
  # metric/panel dashboard-6-flows.yaml (031, dissolved) already authored
  # correctly; re-created here, now actually publishable (FR-011).
  row_trip_mode_flow:
    - type:   sankey
      title:  "Trip Purpose to Mode Flow"
      metric: purpose_mode_flow
      # 038: unpinned. A Sankey has no per-scenario split — the $scenario
      # union sums flows across the active scenarios, so this reads as a
      # COMBINED purpose→mode flow that still responds to the Switch
      # (toggle down to one scenario to see that run alone).
      description: "Combined flow across all active scenarios. Toggle scenarios on the Scenarios tab to isolate one run."
      height: 400
      width:  0.5
      source: primary_purpose
      target: major_trip_mode
      value:  trips
      color_scheme: Tableau10

    # 040-test-suite-migration (T023): the same real metric/flow, with
    # color_scheme omitted — sankeyPanel.spec.ts's real vehicle for the
    # token-derived-fallback-palette case (SankeyPanel.tsx's own
    # --chart-1..4 fallback, not a named d3-scale-chromatic scheme).
    - type:   sankey
      title:  "Trip Purpose to Mode Flow (No Color Scheme)"
      metric: purpose_mode_flow
      description: "Same combined flow as the panel to the left, using the default token-derived palette instead of a named color scheme."
      height: 400
      width:  0.5
      source: primary_purpose
      target: major_trip_mode
      value:  trips

  row_trip_mode_by_period:
    - type:    observable-plot
      title:   "Trip Mode Share by Time-of-Day Period (WALK_LOC)"
      metric:  mode_share_by_period
      # 038: unpinned — the dynamic $scenario union already splits per
      # scenario via `fill: scenario` below, and responds to the
      # Scenarios-tab Switch.
      filter:  { trip_mode: WALK_LOC }
      # Grouped, not stacked — a real, confirmed bug fix: `x: category,
      # fill: scenario` with no facet triggers Plot's own implicit stackY
      # (its docs: "For a grouped bar chart, use faceting"). facet_x
      # carries the real category (time_of_day_period, the field `x`
      # held before this fix); x now holds the comparison dimension
      # (scenario) — same query, same columns, only the encoding changed.
      mark:    barY
      facet_x: time_of_day_period
      x:       scenario
      y:       share
      fill:    scenario
      tip:     true
      grid:    true
      height:  400
      width:   1.0
