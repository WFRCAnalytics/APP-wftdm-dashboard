# 063 redesign: the Summary page on the real ActivitySim example runs (activitysim-baseline, -density-variant,
# -transit-variant; a single model year, no observed or calibration-round data). Tiles whose data these runs do not
# publish (model years, calibration, boardings, speeds) are not part of this deployment's pages.

header:
  tab: Summary
  title: Summary
  description: "Regional totals for the example scenarios"
  icon: layout-dashboard

sections:
  - { id: scenarios, label: "Scenarios", rows: [row_rank_score] }
  - { id: mode, label: "Mode choice", rows: [row_mix_share] }
  - { id: time, label: "Time of day", rows: [row_time] }
  - { id: maps, label: "Maps", rows: [row_zones, row_flows], mode: pick }

layout:
  row_kpis:
    - { type: valuebox, variant: hero, title: Trips, metric: summary_kpis, column: total_trips, format: ",.0f", width: 0.2 }
    - { type: valuebox, variant: hero, title: Households, metric: summary_kpis, column: total_households, format: ",.0f", width: 0.2 }
    - { type: valuebox, variant: hero, title: Vehicle miles, metric: summary_kpis, column: total_vmt, format: ",.0f", unit: mi, width: 0.2 }
    - { type: valuebox, variant: hero, title: Average trip length, metric: summary_kpis, column: avg_trip_length_miles, format: ",.2f", unit: mi, width: 0.2 }
    - { type: valuebox, variant: hero, title: Trips per household, metric: summary_kpis, column: trips_per_household, format: ",.2f", width: 0.2 }

  row_shares:
    - { type: valuebox, variant: hero, title: Drive alone, metric: summary_kpis, column: drive_share, scale: 100, format: ",.1f", unit: "%", ring: { max: 100 }, width: 0.3333 }
    - { type: valuebox, variant: hero, title: Transit, metric: summary_kpis, column: transit_share, scale: 100, format: ",.1f", unit: "%", ring: { max: 50 }, width: 0.3333 }
    - { type: valuebox, variant: hero, title: Walk and bike, metric: summary_kpis, column: active_share, scale: 100, format: ",.1f", unit: "%", ring: { max: 100 }, width: 0.3333 }

  row_rank_score:
    - id: rank
      type: multi-view
      title: "Ranked by metric"
      description: "Scenarios sorted by the chosen metric."
      needs_compare: true
      height: 300
      width: 0.4167
      group_by:
        label: Metric
        default: transit
        options:
          - { id: trips, label: "Trips", fields: { group: trips } }
          - { id: drive, label: "Drive-alone share", fields: { group: drive } }
          - { id: transit, label: "Transit share", fields: { group: transit } }
          - { id: active, label: "Walk and bike share", fields: { group: active } }
          - { id: vmt, label: "Vehicle miles", fields: { group: vmt } }
          - { id: len, label: "Average trip length", fields: { group: len } }
      views:
        - { id: bars, label: Bars, type: chart, kind: rank-bars, diff: true, compare: [overlay] }
    - id: score
      type: multi-view
      title: "Scenario scorecard"
      description: "Every compared scenario against the reference. Click a column to sort."
      needs_compare: true
      height_rows: { base: 120, per: 40, max: 560 }
      height: 300
      width: 0.5833
      views:
        - { id: matrix, label: Matrix, type: chart, kind: scorecard, diff: true, compare: [overlay] }

  row_mix_share:
    - id: mix
      type: multi-view
      title: "Trips by purpose and mode"
      description: "Daily trips for the focus scenario. Hover a mode to trace it across every chart."
      height: 430
      width: 0.5833
      group_by:
        label: Group by
        default: pm
        options:
          - { id: pm, label: "Purpose › Mode", fields: { group: pm } }
          - { id: mp, label: "Mode › Purpose", fields: { group: mp } }
      views:
        - { id: tree, label: Treemap, type: chart, kind: treemap, variant: trips, compare: [multi, diff] }
        - { id: sun, label: Sunburst, type: chart, kind: sunburst, variant: trips, compare: [multi] }
        - { id: radar, label: Radar, type: chart, kind: purpose-radar, compare: [overlay] }
        - { id: flow, label: Flow, type: chart, kind: sankey, compare: [switch] }
        - { id: bars, label: "100% bars", type: chart, kind: stacked-bars, variant: trips, compare: [multi] }
    - id: share
      type: multi-view
      title: "Mode share"
      description: "Share of daily trips. The dashed line is the reference."
      height: 430
      width: 0.4167
      group_by:
        label: Compare by
        default: scn
        options:
          - { id: scn, label: Scenario, fields: { group: scn } }
          - { id: purpose, label: Purpose, fields: { group: purpose } }
      views:
        - { id: bars, label: Bars, type: chart, kind: mode-bars, diff: true, compare: [overlay] }
        - { id: gap, label: Gap, type: chart, kind: gap-dots, diff: true, compare: [overlay] }
        - { id: stack, label: "100% bars", type: chart, kind: stacked-bars, variant: scenario, compare: [overlay] }
        - { id: slope, label: Slope, type: chart, kind: slope, compare: [switch] }
        - { id: donut, label: Donut, type: chart, kind: donut, compare: [switch, diff] }
        - { id: radar, label: Radar, type: chart, kind: mode-radar, compare: [overlay] }
        - { id: tbl, label: Table, type: chart, kind: mode-table, compare: [overlay] }

  row_time:
    - id: time
      type: multi-view
      title: "Trips through the day"
      description: "Departure hour. Group by chooses what the lines or bands represent."
      height: 410
      width: 1.0
      group_by:
        label: Group by
        default: scn
        options:
          - { id: scn, label: Scenario, fields: { group: scn } }
          - { id: purpose, label: Purpose, fields: { group: purpose } }
          - { id: none, label: "All trips", fields: { group: none } }
      views:
        - { id: lines, label: Lines, type: chart, kind: time-lines, diff: true, compare: [overlay] }
        - { id: stream, label: Stream, type: chart, kind: time-stream, compare: [switch, multi] }
        - { id: heat, label: Heatmap, type: chart, kind: time-heat, compare: [overlay] }

  row_zones:
    - id: zones
      type: multi-view
      title: "Where transit is used"
      description: "Transit share of trip ends by traffic analysis zone. Scroll to zoom."
      height: 410
      width: 1.0
      views:
        - { id: map, label: Values, type: chart, kind: zone-map, boundaries: taz25.geoparquet, boundaries_id: TAZ1454, rail: null, compare: [grid, switch] }
        - { id: diffm, label: Difference, type: chart, kind: zone-diff-map, boundaries: taz25.geoparquet, boundaries_id: TAZ1454, rail: null, compare: [diff], needs_compare: true }
        - { id: swipe, label: Swipe, type: chart, kind: zone-swipe-map, boundaries: taz25.geoparquet, boundaries_id: TAZ1454, rail: null, compare: [swipe], needs_compare: true }

  row_flows:
    - id: flows
      type: multi-view
      title: "Trip desire lines"
      description: "Daily trips between zones, one scenario at a time."
      height: 460
      width: 1.0
      views:
        - id: lines
          label: Desire lines
          type: flowmap
          metric: od_flows
          origin: orig_taz
          origin_lat: orig_lat
          origin_lon: orig_lon
          destination: dest_taz
          dest_lat: dest_lat
          dest_lon: dest_lon
          value: trips
          clustering: true
          clustering_auto: true
          compare: [switch]

