# 032-six-tab-demo-content — Summary tab (Level 1 / landing page).
# Replaces the old dashboard-1-overview.yaml entirely (FR-001 — content
# not preserved). Real KPIs + charts from project-docs/CALIBRATION-SUMMARIES.md's
# own "Level 1 — High-Level Summary" table. No sections: this tab is a
# single flat KPI + chart page, matching this project's own established
# Summary-tab convention (CLAUDE.md's Navigation model).

header:
  tab: Summary
  title: Summary
  icon: layout-dashboard

layout:
  # 038-all-loaded-scenarios: every `status === 'ready'` scenario now
  # auto-activates, and an unpinned `$scenario` union no longer breaks on
  # an empty `observed` (a `failed` scenario is never auto-active). So the
  # charts below are UNPINNED — they read as a real multi-scenario
  # comparison and respond to the Scenarios-tab Switch. The KPI value
  # boxes stay pinned to `activitysim-baseline`: a value box renders one
  # number (`rows[0]`), so an unpinned union would surface an arbitrary
  # scenario's row. Each states its baseline scope in `description`.
  row_kpis:
    - type:   valuebox
      title:  Households
      metric: summary_kpis
      scenario: activitysim-baseline
      description: "Baseline scenario. Compare runs on the charts below via the Scenarios tab."
      column: total_households
      format: "{:,.0f}"
      icon:   home
      width:  0.2

    - type:   valuebox
      title:  Persons
      metric: summary_kpis
      scenario: activitysim-baseline
      description: "Baseline scenario. Compare runs on the charts below via the Scenarios tab."
      column: total_persons
      format: "{:,.0f}"
      icon:   users
      width:  0.2

    - type:   valuebox
      title:  Tours
      metric: summary_kpis
      scenario: activitysim-baseline
      description: "Baseline scenario. Compare runs on the charts below via the Scenarios tab."
      column: total_tours
      format: "{:,.0f}"
      icon:   route
      width:  0.2

    - type:   valuebox
      title:  Trips
      metric: summary_kpis
      scenario: activitysim-baseline
      description: "Baseline scenario. Compare runs on the charts below via the Scenarios tab."
      column: total_trips
      format: "{:,.0f}"
      icon:   map-pin
      width:  0.2

    - type:   valuebox
      title:  Total VMT
      metric: summary_kpis
      scenario: activitysim-baseline
      description: "Baseline scenario. Compare runs on the charts below via the Scenarios tab."
      column: total_vmt
      format: "{:,.0f} mi"
      icon:   gauge
      width:  0.2

  # Real total trips by mode (recharts) and real average trip distance by
  # purpose (plotly) — both ★ Level-1 summaries. Unpinned (038): the
  # dynamic `$scenario` union spans every active scenario, split per
  # scenario by `series: scenario` / `name: $scenario`.
  row_charts:
    - type:       recharts
      title:      Total Trips by Mode
      metric:     trip_mode_share
      chart_type: bar
      x:          major_trip_mode
      y:          share
      series:     scenario
      height:     400
      width:      0.5

    - type:    plotly
      title:   Average Trip Distance by Purpose
      metric:  trip_distance_by_purpose
      height:  400
      width:   0.5
      traces:
        - type: bar
          x:    $metric.primary_purpose
          y:    $metric.avg_distance_miles
          name: $scenario
      layout:
        xaxis: { title: "Purpose" }
        yaxis: { title: "Average Distance (straight-line miles)" }
        showlegend: true

  # 040-test-suite-migration (T020) — a real, rich Methodology Notes
  # panel, richer than every other real demo markdown panel (which are
  # all plain-paragraph gap notes) — headings/emphasis/lists/a link/a
  # GFM table/a code span, exercising markdown-panel.spec.ts's own
  # typography and rendering coverage against genuine content.
  row_methodology:
    - type:  markdown
      title: "Methodology Notes"
      width: 1.0
      content: |
        ## Straight-Line Distance Proxy

        Several distance-based metrics in this demo (Trip Destination,
        Non-Mandatory Tour Destination, VMT by Home TAZ) use a
        **haversine straight-line distance** between real zone centroids
        rather than a modeled network distance — this project's
        `prototype_mtc` synthetic 25-zone system has no calibrated
        network skim available. Reported distances are therefore
        *approximate, not authoritative*.

        Real data sources feeding these metrics:

        1. ActivitySim's own `final_trips.csv` output
        2. The real `zone_centroids` lookup table (25 MTC TAZ ids)
        3. The post-processor's own `summarize.yaml` SQL fragments

        Known caveats:

        - Six real submodel gaps have no computable data in this
          deployment — see each gap note on its own tab.
        - Same-zone (intrazonal) trips are clamped to avoid a domain
          error in the underlying distance computation.

        | Check | Tolerance |
        | --- | --- |
        | Trip length distribution | ±10% |
        | Mode share by purpose | ±5 percentage points |

        See the [ActivitySim documentation](https://activitysim.github.io/activitysim/)
        for the underlying travel model framework.
