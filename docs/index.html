    <!-- 060-boot-notifications: a SEPARATE root, sibling to #app, not a
         child of it. main.tsx's own boot sequence (initDuckDB ->
         discoverScenarios -> loadDashboards, see the #app comment above)
         runs entirely before ReactDOM ever calls
         createRoot(appEl).render(<Shell/>) — mounting the notification
         Toaster into #app itself would collide with that later call
         (React warns/errors calling createRoot() twice on one container).
         This root is created, and its own tiny React tree rendered, as
         the very first thing main.tsx does, before any boot step starts —
         sonner's toast() calls are only ever delivered to a Toaster that
         is ALREADY mounted and subscribed (confirmed directly against
         sonner's own source: new toasts publish only to the subscriber
         list at call time, a late-mounting Toaster does not replay
         history) — and persists for the app's whole lifetime, independent
         of whatever #app itself is doing. -->
