  # Tour Models tab — At-Work Subtour Scheduling
  - name: atwork_subtour_scheduling
    description: Real at-work subtour start/end by purpose
    sql: |
      SELECT
        primary_purpose,
        start,
        "end",
        COUNT(*) AS tours
      FROM tours
      WHERE tour_category = 'atwork'
      GROUP BY primary_purpose, start, "end"

  # Tour Models tab — Stop Frequency
  - name: stop_frequency_summary
    description: Real outbound/inbound stop frequency codes by tour purpose
    sql: |
      SELECT
        primary_purpose,
        stop_frequency,
        COUNT(*) AS tours
      FROM tours
      GROUP BY primary_purpose, stop_frequency

  # Mode Choice tab — Tour Mode Choice ★
  - name: tour_mode_share_summary
    description: Real tour mode share by purpose, auto sufficiency, person type, sex, income group
    sql: |
      SELECT
        t.primary_purpose,
        t.tour_mode,
        CASE
          WHEN h.auto_ownership = 0 THEN 'Zero Autos'
          WHEN h.auto_ownership < h.num_workers THEN 'Autos < Workers'
          ELSE 'Autos >= Workers'
        END AS auto_sufficiency,
        CASE p.ptype $mappings.person_type END AS person_type,
        p.sex,
        $bins.income_group AS income_group,
        COUNT(*) AS tours
      FROM tours t
      JOIN households h ON t.household_id = h.household_id
      JOIN persons p ON t.person_id = p.person_id
      GROUP BY t.primary_purpose, t.tour_mode, auto_sufficiency, person_type, p.sex, income_group

  # Mode Choice tab — At-Work Subtour Mode Choice
  - name: atwork_subtour_mode_summary
    description: Real at-work subtour mode share by purpose
    sql: |
      SELECT
        primary_purpose,
        tour_mode,
        COUNT(*) AS tours
      FROM tours
      WHERE tour_category = 'atwork'
      GROUP BY primary_purpose, tour_mode

  # Trip Models tab — Trip Destination ★
  - name: trip_destination_summary
    description: Real trip destination distance distribution by purpose
    sql: |
      WITH d AS (
        SELECT
          t.primary_purpose,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM trips t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
      )
      SELECT
        primary_purpose,
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS trips
      FROM d
      GROUP BY primary_purpose, distance_bin

  # Trip Models tab — Trip Scheduling ★ (hourly + aggregate period, both
  # in one table).
  - name: trip_scheduling
    description: Real trip departure hour and time-of-day period by purpose
    sql: |
      SELECT
        primary_purpose,
        depart AS depart_hour,
        $bins.time_of_day_period AS time_of_day_period,
        COUNT(*) AS trips
      FROM trips
      GROUP BY primary_purpose, depart_hour, time_of_day_period

  # Trip Models tab — Zone Trip Ends by Mode (spatial rollup, not a
  # discrete submodel — data-model.md §1).
  - name: trip_ends_by_zone_mode
    description: Real trip production/attraction ends by zone, district, and grouped mode
    sql: |
      WITH ends AS (
        SELECT origin      AS zone_id, 'production' AS trip_end, trip_mode FROM trips
        UNION ALL
        SELECT destination AS zone_id, 'attraction' AS trip_end, trip_mode FROM trips
      )
      SELECT
        e.zone_id,
        lu.DISTRICT AS district,
        e.trip_end,
        CASE e.trip_mode $mappings.major_trip_mode END AS major_trip_mode,
        COUNT(*) AS trips
      FROM ends e
      JOIN land_use lu ON e.zone_id = lu.zone_id
      GROUP BY e.zone_id, lu.DISTRICT, e.trip_end, major_trip_mode

  # Network tab — Land Use / Socioeconomics (input data, not modeled).
  - name: land_use_summary
    description: Real zone-level land use plus household aggregates (income, auto ownership)
    sql: |
      SELECT
        lu.zone_id,
        lu.DISTRICT,
        lu.SD,
        lu.TOTHH,
        lu.TOTPOP,
        lu.TOTEMP,
        lu.RETEMPN,
        lu.FPSEMPN,
        lu.HEREMPN,
        lu.OTHEMPN,
        lu.AGREMPN,
        lu.MWTEMPN,
        lu.area_type,
        lu.HSENROLL,
        lu.COLLFTE,
        lu.COLLPTE,
        h_agg.avg_income,
        h_agg.avg_auto_ownership,
        h_agg.households
      FROM land_use lu
      LEFT JOIN (
        SELECT
          home_zone_id,
          AVG(income) AS avg_income,
          AVG(auto_ownership) AS avg_auto_ownership,
          COUNT(*) AS households
        FROM households
        GROUP BY home_zone_id
      ) h_agg ON lu.zone_id = h_agg.home_zone_id

  # Network tab — Accessibility (real ActivitySim accessibility component
  # output, passed through unmodified).
  - name: accessibility_summary
    description: Real zone-level auto/transit accessibility to jobs and households
    sql: |
      SELECT
        zone_id,
        auPkRetail, auPkTotal, auOpRetail, auOpTotal,
        trPkRetail, trPkTotal, trOpRetail, trOpTotal,
        nmRetail, nmTotal
      FROM accessibility

  # Network tab — VMT by Home TAZ (real straight-line distance proxy,
  # research.md §4 — no network-assignment step exists in this pipeline).
  - name: vmt_by_home_taz
    description: Real total trip distance (straight-line proxy) summed by home zone/district
    sql: |
      WITH trip_d AS (
        SELECT
          t.household_id,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM trips t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
      )
      SELECT
        h.home_zone_id,
        lu.DISTRICT AS home_district,
        SUM(td.distance_miles) AS total_vmt,
        COUNT(*) AS trips
      FROM trip_d td
      JOIN households h ON td.household_id = h.household_id
      JOIN land_use lu ON h.home_zone_id = lu.zone_id
      GROUP BY h.home_zone_id, lu.DISTRICT
