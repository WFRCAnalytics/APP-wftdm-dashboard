# summarize.yaml — 026-activitysim-demo-content
#
# Authored against ActivitySim's real, confirmed prototype_mtc output shape
# (specs/026-activitysim-demo-content/research.md), not the illustrative
# column names in docs/GRAMMAR.md's own worked example. Run unmodified,
# three times, once per real raw ActivitySim output directory (baseline,
# density-variant, transit-variant) — see
# specs/026-activitysim-demo-content/contracts/discovery.md for the exact
# three `wftdm-dashboard summarize` invocations.
#
# Never published to the browser (constitution: summarize.yaml is
# post-processor-only).

version: 2

# ── Sources ──────────────────────────────────────────────────────────────
# Real ActivitySim final_*.csv output filenames, resolved relative to
# --input at CLI invocation time.

sources:
  households: final_households.csv
  persons:    final_persons.csv
  tours:      final_tours.csv
  trips:      final_trips.csv
  land_use:   final_land_use.csv
  # 032-six-tab-demo-content: two new real sources, confirmed present in
  # every real scenario's output/ directory (research.md §2) — needed for
  # Joint Tour Participation and Accessibility respectively.
  joint_tour_participants: final_joint_tour_participants.csv
  accessibility:           final_accessibility.csv

# ── Mappings ─────────────────────────────────────────────────────────────
# Real ActivitySim mode names (confirmed against configs/tour_mode_choice.csv
# / trip_mode_choice.csv this session) grouped into 5 categories.

mappings:
  major_trip_mode:
    DRIVEALONEFREE: SOV
    DRIVEALONEPAY:  SOV
    SHARED2FREE:    HOV
    SHARED2PAY:     HOV
    SHARED3FREE:    HOV
    SHARED3PAY:     HOV
    WALK_LOC:       Transit
    WALK_LRF:       Transit
    WALK_EXP:       Transit
    WALK_HVY:       Transit
    WALK_COM:       Transit
    DRIVE_LOC:      Transit
    DRIVE_LRF:      Transit
    DRIVE_EXP:      Transit
    DRIVE_HVY:      Transit
    DRIVE_COM:      Transit
    WALK:           Non-Motorized
    BIKE:           Non-Motorized
    TAXI:           Ride Hail
    TNC_SINGLE:     Ride Hail
    TNC_SHARED:     Ride Hail

  # 032-six-tab-demo-content: real, standard ActivitySim person-type codes
  # (persons.ptype, confirmed real values 1-8 in every scenario's real
  # output — research.md §2). 1-7 match docs/CALIBRATION-SUMMARIES.md's
  # own already-documented "Person type" segmentation list exactly; 8
  # (pre-school child) was found missing from that list during this
  # feature's own audit and is added to both the doc (see
  # contracts/calibration-summaries-corrections.md) and here.
  person_type:
    1: Full-time worker
    2: Part-time worker
    3: University student
    4: Non-worker
    5: Retired
    6: Driving-age student
    7: Non-driving student
    8: Pre-school child

# ── Bins ─────────────────────────────────────────────────────────────────
# time_of_day_period buckets `depart` (an integer hour-of-day column on
# trips) into ActivitySim's own real EA/AM/MD/PM/EV periods, per this
# feature's own network_los.yaml-confirmed boundaries (research.md #2).
# Only breaks[1..4] (5, 9, 14, 18) are load-bearing SQL boundaries —
# breaks[0]/breaks[5] (0, 24) are documentary bookends only, per
# _expand_manual_breaks()'s real, confirmed codegen.

bins:
  time_of_day_period:
    column: depart
    type:   manual_breaks
    breaks: [0, 5, 9, 14, 18, 24]
    labels: [EA, AM, MD, PM, EV]

  # 032-six-tab-demo-content: real household income (households.income),
  # boundaries matching docs/CALIBRATION-SUMMARIES.md's own already-
  # documented "Income group" segmentation definition exactly.
  income_group:
    column: income
    type:   manual_breaks
    breaks: [0, 25000, 50000, 75000, 100000, 99999999]
    labels: [Very Low, Low, Medium, High, Very High]

  # 032-six-tab-demo-content: shared half-mile distance bucketing for
  # every distance-based summary in this feature (School/Workplace/Joint/
  # Non-Mandatory/At-Work Subtour/Trip Destination) — matching
  # docs/CALIBRATION-SUMMARIES.md's own "Distance bin" segmentation
  # definition (0.5-mile intervals, lower = 0). Every metric using this
  # bin aliases its own real distance value (whether a precomputed real
  # column like distance_to_work, or a computed real haversine distance
  # between two real zone centroids — contracts/summarize-metrics.md) as
  # `distance_miles` in an inner SELECT/CTE, specifically so this ONE bin
  # definition can be reused everywhere rather than one per metric.
  distance_bin_half_mile:
    column:   distance_miles
    type:     spaced_intervals
    interval: 0.5
    lower:    0

# ── SQL Fragments ────────────────────────────────────────────────────────

sql_fragments:
  trips_merged: |
    trips t
    JOIN land_use lu ON t.destination = lu.zone_id

  # 031-all-panel-demo-content: real TAZ 1-25 centroids, derived
  # (ST_Centroid) from real MTC TAZ1454 boundary geometry — MTC's own
  # public, official open-data FeatureServer (services3.arcgis.com/
  # i2dkYWmb4wHvYPda/arcgis/rest/services/Travel_Analysis_Zones/
  # FeatureServer), confirmed reachable and correspondence-verified this
  # feature's own planning research (specs/031-all-panel-demo-content/
  # research.md §1 — real SD/SUPERD cross-reference, real-world geography
  # matching TAZ 1's own extreme-employment land-use signature). Produced
  # by scripts/build-demo-zone-geometry.py, run once
  # (2026-09-08) — never independently sourced or approximated; every
  # value here is ST_Centroid() of the exact same real polygon published
  # to public/demo-geometry/taz25.geoparquet.
  # Deliberately NOT self-aliased (no "AS zc(...)" here) — od_flows below
  # needs this fragment TWICE in one query (once for origin, once for
  # destination), each with its own distinct alias/column names. A fixed
  # embedded alias would collide the moment a second reference appended
  # its own alias after it (confirmed empirically: DuckDB rejects the
  # resulting double-aliased syntax) — the caller supplies
  # "AS c1(zone_id, lat, lon)"/"AS c2(zone_id, lat, lon)" instead.
  zone_centroids: |
    (VALUES
      (1, 37.793138, -122.398299),
      (2, 37.792440, -122.402033),
      (3, 37.791501, -122.405715),
      (4, 37.789965, -122.401984),
      (5, 37.788148, -122.406084),
      (6, 37.788932, -122.411797),
      (7, 37.786565, -122.411344),
      (8, 37.783310, -122.411409),
      (9, 37.780778, -122.417245),
      (10, 37.776782, -122.413964),
      (11, 37.781885, -122.407504),
      (12, 37.786278, -122.401971),
      (13, 37.788975, -122.398655),
      (14, 37.790870, -122.396233),
      (15, 37.792733, -122.393420),
      (16, 37.787831, -122.393680),
      (17, 37.784282, -122.390667),
      (18, 37.778451, -122.398286),
      (19, 37.772740, -122.405630),
      (20, 37.775169, -122.409826),
      (21, 37.781155, -122.402190),
      (22, 37.796397, -122.396233),
      (23, 37.801557, -122.400426),
      (24, 37.795657, -122.402656),
      (25, 37.795623, -122.406517)
    )

# 032-six-tab-demo-content (research.md §4, contracts/summarize-
# metrics.md): the shared real-distance formula every distance-dependent
# metric below reuses verbatim — a plain haversine expression over two
# real zone_centroids references (the same c1/c2 alias convention
# od_flows below already established), in real miles. This is a
# straight-line distance between two real zone centroids, NOT a modeled
# network/path distance (this pipeline has no traffic-assignment step —
# research.md §2) — every panel that displays a value computed this way
# says so explicitly in its own description, per research.md §4:
#
#   3959 * acos(
#     LEAST(1.0, GREATEST(-1.0,
#       cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
#       + sin(radians(c1.lat)) * sin(radians(c2.lat))
#     ))
#   ) AS distance_miles
#
# The LEAST/GREATEST clamp is load-bearing, not defensive style: found via
# a real, reproducible failure running this formula against real data —
# a same-zone trip (origin == destination) makes the acos() argument
# evaluate to a floating-point value fractionally ABOVE 1.0 (e.g.
# 1.0000000000000002), and DuckDB's acos() throws ("ACOS is undefined
# outside [-1,1]") rather than silently clamping, unlike some other SQL
# engines' equivalent functions.

# ── Metrics ──────────────────────────────────────────────────────────────
# Five metrics, each → one Parquet file in summary/{name}.parquet.
# See data-model.md for the full column-level contract each one satisfies.

metrics:

  # FR-002(c): scalar KPIs for the Overview tab's value boxes.
  - name: summary_kpis
    description: Scalar KPIs for the Overview tab's value boxes
    sql: |
      SELECT
        (SELECT COUNT(DISTINCT household_id) FROM households) AS total_households,
        (SELECT COUNT(DISTINCT person_id)    FROM persons)    AS total_persons,
        (SELECT COUNT(DISTINCT trip_id)      FROM trips)      AS total_trips,
        (SELECT COUNT(DISTINCT tour_id)      FROM tours)      AS total_tours,
        (SELECT AVG(mode_choice_logsum)      FROM trips)      AS avg_trip_mode_choice_logsum,
        (SELECT COUNT(DISTINCT trip_id) FROM trips) * 1.0
          / (SELECT COUNT(DISTINCT household_id) FROM households) AS trips_per_household,
        -- 032-six-tab-demo-content: real total VMT — a straight-line
        -- distance proxy summed across every real trip (research.md §4/
        -- contracts/summarize-metrics.md's shared haversine formula;
        -- this pipeline has no network-assignment step, so no real
        -- modeled-path VMT exists to report instead).
        (SELECT SUM(d.distance_miles) FROM (
          SELECT 3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
          FROM trips t
          JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
          JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
        ) d) AS total_vmt

  # FR-002(a): trips/tours by destination zone — makes the density
  # variant's real TAZ 1 destination-choice pull visible (User Story 1),
  # and is the basis of the $baseline diff panel (User Story 3).
  - name: trips_by_destination_zone
    description: Trips and tours aggregated by destination zone and purpose
    sql: |
      SELECT
        lu.zone_id       AS destination_zone_id,
        t.primary_purpose,
        COUNT(*)                  AS trips,
        COUNT(DISTINCT t.tour_id) AS tours
      FROM $sql.trips_merged
      GROUP BY lu.zone_id, t.primary_purpose

  # FR-002(b): trip mode share by time-of-day period — makes the transit
  # variant's real AM/PM WALK_LOC shift visible (User Story 2). Kept at
  # the real, ungrouped trip_mode (not major_trip_mode) since the whole
  # point is the WALK_LOC-specific shift, which grouping into "Transit"
  # would hide.
  - name: mode_share_by_period
    description: Trip mode share by real ActivitySim time-of-day period
    sql: |
      SELECT
        $bins.time_of_day_period AS time_of_day_period,
        t.trip_mode,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER (PARTITION BY $bins.time_of_day_period) AS share
      FROM trips t
      GROUP BY time_of_day_period, t.trip_mode

  # FR-002(d): overall trip mode share (not time-split) for the Overview tab.
  - name: trip_mode_share
    description: Overall trip mode share by grouped major mode category
    sql: |
      SELECT
        CASE t.trip_mode $mappings.major_trip_mode END AS major_trip_mode,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER () AS share
      FROM trips t
      GROUP BY major_trip_mode

  # FR-002(e): trip purpose breakdown for the Overview tab.
  - name: trip_purpose_share
    description: Trip counts and share by primary purpose
    sql: |
      SELECT
        t.primary_purpose,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER () AS share
      FROM trips t
      GROUP BY t.primary_purpose

  # 031-all-panel-demo-content, User Story 2 (FR-006): real trip counts by
  # purpose x grouped mode, for the Sankey panel. Reuses two already-real,
  # already-proven columns (trip_purpose_share already groups by
  # primary_purpose; trip_mode_share already applies this exact
  # $mappings.major_trip_mode expansion) — no new source/mapping needed.
  # A full partition of `trips` with no WHERE — SUM(trips) over the whole
  # output equals the real total trip count for the scenario
  # (contracts/new-metrics.md's own invariant, covered by
  # python/tests/test_pipeline.py's new test_purpose_mode_flow_sums_to_
  # total_trips case).
  #
  # PENDING PUBLICATION — see CLAUDE.md's own 031-all-panel-demo-content
  # entry: this metric's SQL is real and correct, but no raw ActivitySim
  # input was available in the environment this was authored in to
  # actually run the pipeline and publish real Parquet output for it yet.
  - name: purpose_mode_flow
    description: Real trip counts by primary purpose and grouped major trip mode (Sankey source/target)
    sql: |
      SELECT
        t.primary_purpose,
        CASE t.trip_mode $mappings.major_trip_mode END AS major_trip_mode,
        COUNT(*) AS trips
      FROM trips t
      GROUP BY t.primary_purpose, major_trip_mode

  # 031-all-panel-demo-content, User Story 3 (FR-009): real origin-
  # destination trip flows with real MTC zone-centroid coordinates
  # (zone_centroids, above) for the FlowMap panel. Every orig_lat/
  # orig_lon/dest_lat/dest_lon value is byte-identical to the matching
  # zone_centroids row by construction (an equality JOIN on zone_id) —
  # contracts/new-metrics.md's own invariant.
  #
  # `t.origin` — NOT yet independently re-verified against a real raw
  # final_trips.csv in the environment this was authored in (no raw
  # ActivitySim input was available); written on the well-evidenced
  # basis that docs/GRAMMAR.md's own od_flows worked example already
  # references t.origin as ActivitySim's standard trip-table shape,
  # alongside t.destination, which this file's own trips_merged fragment
  # already confirms is real. MUST be confirmed directly against the real
  # file before this metric is ever run for real (per this feature's own
  # non-negotiable FR-001) — see CLAUDE.md's own 031 entry for the exact
  # remaining step.
  #
  # A real trip whose origin/destination falls outside zones 1-25 is
  # silently excluded by the inner JOINs below (not a separate filter) —
  # SUM(trips) here may legitimately be less than the real total trip
  # count; this MUST be checked empirically once real data is available,
  # not assumed either way (contracts/new-metrics.md).
  #
  # PENDING PUBLICATION — same status as purpose_mode_flow above.
  - name: od_flows
    description: Real origin-destination trip flows with real MTC zone-centroid coordinates
    sql: |
      SELECT
        t.origin      AS orig_taz,
        t.destination AS dest_taz,
        CAST(c1.lat AS DOUBLE) AS orig_lat, CAST(c1.lon AS DOUBLE) AS orig_lon,
        CAST(c2.lat AS DOUBLE) AS dest_lat, CAST(c2.lon AS DOUBLE) AS dest_lon,
        COUNT(*) AS trips
      FROM trips t
      JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
      JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
      GROUP BY t.origin, t.destination, c1.lat, c1.lon, c2.lat, c2.lon

  # ── 032-six-tab-demo-content ─────────────────────────────────────────
  # 27 new metrics, one per genuinely computable submodel summary from
  # the real audit in specs/032-six-tab-demo-content/data-model.md §1.
  # Every real gap found by that audit (Work from Home, Telecommute
  # Frequency, Transit Pass Subsidy, Transit Pass Ownership, Screenline
  # Volumes vs Observed AADT, VMT by Facility Type) has NO metric here —
  # per FR-009, reported in docs/CALIBRATION-SUMMARIES.md instead of
  # built. See contracts/summarize-metrics.md for the shared shape rules.

  # Summary tab — real average trip distance by purpose.
  - name: trip_distance_by_purpose
    description: Real average straight-line trip distance (miles) by primary purpose
    sql: |
      WITH d AS (
        SELECT
          t.primary_purpose,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM trips t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
      )
      SELECT
        primary_purpose,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS trips
      FROM d
      GROUP BY primary_purpose

  # Person/Household Models tab — Auto Ownership ★
  - name: auto_ownership_summary
    description: Real household auto ownership by household size, income group, workers, and home district
    sql: |
      SELECT
        h.auto_ownership,
        h.hhsize,
        $bins.income_group AS income_group,
        h.num_workers,
        lu.DISTRICT AS home_district,
        COUNT(*) AS households
      FROM households h
      JOIN land_use lu ON h.home_zone_id = lu.zone_id
      GROUP BY h.auto_ownership, h.hhsize, income_group, h.num_workers, lu.DISTRICT

  # Person/Household Models tab — School Location
  - name: school_location_summary
    description: Real school-location distance distribution by school segment
    sql: |
      SELECT
        school_segment,
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS students
      FROM (
        SELECT school_segment, distance_to_school AS distance_miles
        FROM persons
        WHERE is_student AND school_zone_id IS NOT NULL
      ) s
      GROUP BY school_segment, distance_bin

  # Person/Household Models tab — Workplace Location ★
  - name: workplace_location_summary
    description: Real workplace-location distance distribution
    sql: |
      SELECT
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS workers
      FROM (
        SELECT distance_to_work AS distance_miles
        FROM persons
        WHERE is_worker AND workplace_zone_id IS NOT NULL
      ) w
      GROUP BY distance_bin

  # Person/Household Models tab (+ Network tab) — Workplace Location ★
  # county-to-county / district-to-district home-workplace flow.
  - name: workplace_od_flows
    description: Real home-district to workplace-district worker flows
    sql: |
      SELECT
        lu_home.DISTRICT AS home_district,
        lu_work.DISTRICT AS work_district,
        COUNT(*) AS workers
      FROM persons p
      JOIN households h ON p.household_id = h.household_id
      JOIN land_use lu_home ON h.home_zone_id     = lu_home.zone_id
      JOIN land_use lu_work ON p.workplace_zone_id = lu_work.zone_id
      WHERE p.is_worker AND p.workplace_zone_id IS NOT NULL
      GROUP BY lu_home.DISTRICT, lu_work.DISTRICT

  # Person/Household Models tab — CDAP
  - name: cdap_summary
    description: Real CDAP activity pattern by person type, auto sufficiency, and household size
    sql: |
      SELECT
        p.cdap_activity,
        CASE p.ptype $mappings.person_type END AS person_type,
        CASE
          WHEN h.auto_ownership = 0 THEN 'Zero Autos'
          WHEN h.auto_ownership < h.num_workers THEN 'Autos < Workers'
          ELSE 'Autos >= Workers'
        END AS auto_sufficiency,
        h.hhsize,
        COUNT(*) AS persons
      FROM persons p
      JOIN households h ON p.household_id = h.household_id
      GROUP BY p.cdap_activity, person_type, auto_sufficiency, h.hhsize

  # Person/Household Models tab — open-ended exploration dataset
  # (graphic-walker, FR-013/US3). Deliberately ungrouped — one real row
  # per person (contracts/summarize-metrics.md's own singular exception
  # to the "every metric is grouped" rule).
  - name: person_household_profile
    description: Real one-row-per-person profile for open-ended exploration
    sql: |
      SELECT
        p.person_id,
        h.household_id,
        h.auto_ownership,
        h.hhsize,
        $bins.income_group AS income_group,
        CASE p.ptype $mappings.person_type END AS person_type,
        p.sex,
        p.age,
        lu.DISTRICT AS home_district,
        p.workplace_zone_id,
        p.school_zone_id,
        p.cdap_activity,
        p.mandatory_tour_frequency,
        h.num_workers
      FROM persons p
      JOIN households h ON p.household_id = h.household_id
      JOIN land_use lu ON h.home_zone_id = lu.zone_id

  # Tour Models tab — Mandatory Tour Frequency
  - name: mandatory_tour_freq_summary
    description: Real mandatory tour frequency by person type
    sql: |
      SELECT
        p.mandatory_tour_frequency,
        CASE p.ptype $mappings.person_type END AS person_type,
        COUNT(*) AS persons
      FROM persons p
      WHERE p.mandatory_tour_frequency IS NOT NULL AND p.mandatory_tour_frequency != ''
      GROUP BY p.mandatory_tour_frequency, person_type

  # Tour Models tab — Mandatory Tour Scheduling
  - name: mandatory_tour_scheduling
    description: Real mandatory tour start/end/duration by purpose
    sql: |
      SELECT
        primary_purpose,
        start,
        "end",
        duration,
        COUNT(*) AS tours
      FROM tours
      WHERE tour_category = 'mandatory'
      GROUP BY primary_purpose, start, "end", duration

  # Tour Models tab — Joint Tour Frequency and Composition
  - name: joint_tour_freq_summary
    description: Real joint tour frequency/composition by household
    sql: |
      SELECT
        joint_tour_frequency,
        num_hh_joint_tours,
        COUNT(*) AS households
      FROM households
      WHERE joint_tour_frequency IS NOT NULL AND joint_tour_frequency != ''
      GROUP BY joint_tour_frequency, num_hh_joint_tours

  # Tour Models tab — Joint Tour Participation. Real participant counts,
  # not a literal per-eligible-person binary choice (data-model.md §1's
  # own documented partial-computability caveat).
  - name: joint_tour_participation_summary
    description: Real joint tour participant counts by purpose (participant-count level, not a per-eligible-person binary)
    sql: |
      SELECT
        t.primary_purpose,
        t.number_of_participants,
        COUNT(DISTINCT t.tour_id) AS tours
      FROM tours t
      WHERE t.tour_category = 'joint'
      GROUP BY t.primary_purpose, t.number_of_participants

  # Tour Models tab — Joint Tour Destination
  - name: joint_tour_destination_summary
    description: Real joint tour destination distance distribution by purpose
    sql: |
      WITH d AS (
        SELECT
          t.primary_purpose,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM tours t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
        WHERE t.tour_category = 'joint'
      )
      SELECT
        primary_purpose,
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS tours
      FROM d
      GROUP BY primary_purpose, distance_bin

  # Tour Models tab — Joint Tour Scheduling
  - name: joint_tour_scheduling
    description: Real joint tour start/end/duration by purpose
    sql: |
      SELECT
        primary_purpose,
        start,
        "end",
        duration,
        COUNT(*) AS tours
      FROM tours
      WHERE tour_category = 'joint'
      GROUP BY primary_purpose, start, "end", duration

  # Tour Models tab — Non-Mandatory Tour Frequency. Real per-purpose tour
  # counts already tallied onto each person by ActivitySim itself
  # (num_escort_tours etc.) — unpivoted via UNION ALL.
  - name: non_mandatory_tour_freq_summary
    description: Real non-mandatory tour frequency by purpose
    sql: |
      SELECT 'escort' AS purpose, SUM(num_escort_tours) AS tours FROM persons
      UNION ALL SELECT 'eat out', SUM(num_eatout_tours) FROM persons
      UNION ALL SELECT 'shopping', SUM(num_shop_tours) FROM persons
      UNION ALL SELECT 'maintenance', SUM(num_maint_tours) FROM persons
      UNION ALL SELECT 'discretionary', SUM(num_discr_tours) FROM persons
      UNION ALL SELECT 'social', SUM(num_social_tours) FROM persons

  # Tour Models tab — Non-Mandatory Tour Destination
  - name: non_mandatory_tour_destination_summary
    description: Real non-mandatory tour destination distance distribution by purpose
    sql: |
      WITH d AS (
        SELECT
          t.primary_purpose,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM tours t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
        WHERE t.tour_category = 'non_mandatory'
      )
      SELECT
        primary_purpose,
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
        COUNT(*) AS tours
      FROM d
      GROUP BY primary_purpose, distance_bin

  # Tour Models tab — Non-Mandatory Tour Scheduling
  - name: non_mandatory_tour_scheduling
    description: Real non-mandatory tour start/end/duration by purpose
    sql: |
      SELECT
        primary_purpose,
        start,
        "end",
        duration,
        COUNT(*) AS tours
      FROM tours
      WHERE tour_category = 'non_mandatory'
      GROUP BY primary_purpose, start, "end", duration

  # Tour Models tab — At-Work Subtour Frequency. Real column lives on the
  # real PARENT work tour, not the subtour itself.
  - name: atwork_subtour_freq_summary
    description: Real at-work subtour frequency, on parent work tours
    sql: |
      SELECT
        atwork_subtour_frequency,
        COUNT(*) AS parent_work_tours
      FROM tours
      WHERE primary_purpose = 'work'
        AND tour_category = 'mandatory'
        AND atwork_subtour_frequency IS NOT NULL
        AND atwork_subtour_frequency != ''
      GROUP BY atwork_subtour_frequency

  # Tour Models tab — At-Work Subtour Destination
  - name: atwork_subtour_destination_summary
    description: Real at-work subtour destination distance distribution by purpose
    sql: |
      WITH d AS (
        SELECT
          t.primary_purpose,
          3959 * acos(
            LEAST(1.0, GREATEST(-1.0,
              cos(radians(c1.lat)) * cos(radians(c2.lat)) * cos(radians(c2.lon) - radians(c1.lon))
              + sin(radians(c1.lat)) * sin(radians(c2.lat))
            ))
          ) AS distance_miles
        FROM tours t
        JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
        JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
        WHERE t.tour_category = 'atwork'
      )
      SELECT
        primary_purpose,
        $bins.distance_bin_half_mile AS distance_bin,
        AVG(distance_miles) AS avg_distance_miles,
