# summarize.yaml — 026-activitysim-demo-content
#
# Authored against ActivitySim's real, confirmed prototype_mtc output shape
# (specs/026-activitysim-demo-content/research.md), not the illustrative
# column names in docs/GRAMMAR.md's own worked example. Run unmodified,
# three times, once per real raw ActivitySim output directory (baseline,
# density-variant, transit-variant) — see
# specs/026-activitysim-demo-content/contracts/discovery.md for the exact
# three `wftdm-dashboard summarize` invocations.
#
# Never published to the browser (constitution: summarize.yaml is
# post-processor-only).

version: 2

# ── Sources ──────────────────────────────────────────────────────────────
# Real ActivitySim final_*.csv output filenames, resolved relative to
# --input at CLI invocation time.

sources:
  households: final_households.csv
  persons:    final_persons.csv
  tours:      final_tours.csv
  trips:      final_trips.csv
  land_use:   final_land_use.csv

# ── Mappings ─────────────────────────────────────────────────────────────
# Real ActivitySim mode names (confirmed against configs/tour_mode_choice.csv
# / trip_mode_choice.csv this session) grouped into 5 categories.

mappings:
  major_trip_mode:
    DRIVEALONEFREE: SOV
    DRIVEALONEPAY:  SOV
    SHARED2FREE:    HOV
    SHARED2PAY:     HOV
    SHARED3FREE:    HOV
    SHARED3PAY:     HOV
    WALK_LOC:       Transit
    WALK_LRF:       Transit
    WALK_EXP:       Transit
    WALK_HVY:       Transit
    WALK_COM:       Transit
    DRIVE_LOC:      Transit
    DRIVE_LRF:      Transit
    DRIVE_EXP:      Transit
    DRIVE_HVY:      Transit
    DRIVE_COM:      Transit
    WALK:           Non-Motorized
    BIKE:           Non-Motorized
    TAXI:           Ride Hail
    TNC_SINGLE:     Ride Hail
    TNC_SHARED:     Ride Hail

# ── Bins ─────────────────────────────────────────────────────────────────
# time_of_day_period buckets `depart` (an integer hour-of-day column on
# trips) into ActivitySim's own real EA/AM/MD/PM/EV periods, per this
# feature's own network_los.yaml-confirmed boundaries (research.md #2).
# Only breaks[1..4] (5, 9, 14, 18) are load-bearing SQL boundaries —
# breaks[0]/breaks[5] (0, 24) are documentary bookends only, per
# _expand_manual_breaks()'s real, confirmed codegen.

bins:
  time_of_day_period:
    column: depart
    type:   manual_breaks
    breaks: [0, 5, 9, 14, 18, 24]
    labels: [EA, AM, MD, PM, EV]

# ── SQL Fragments ────────────────────────────────────────────────────────

sql_fragments:
  trips_merged: |
    trips t
    JOIN land_use lu ON t.destination = lu.zone_id

  # 031-all-panel-demo-content: real TAZ 1-25 centroids, derived
  # (ST_Centroid) from real MTC TAZ1454 boundary geometry — MTC's own
  # public, official open-data FeatureServer (services3.arcgis.com/
  # i2dkYWmb4wHvYPda/arcgis/rest/services/Travel_Analysis_Zones/
  # FeatureServer), confirmed reachable and correspondence-verified this
  # feature's own planning research (specs/031-all-panel-demo-content/
  # research.md §1 — real SD/SUPERD cross-reference, real-world geography
  # matching TAZ 1's own extreme-employment land-use signature). Produced
  # by scripts/build-demo-zone-geometry.py, run once
  # (2026-09-08) — never independently sourced or approximated; every
  # value here is ST_Centroid() of the exact same real polygon published
  # to public/demo-geometry/taz25.geoparquet.
  # Deliberately NOT self-aliased (no "AS zc(...)" here) — od_flows below
  # needs this fragment TWICE in one query (once for origin, once for
  # destination), each with its own distinct alias/column names. A fixed
  # embedded alias would collide the moment a second reference appended
  # its own alias after it (confirmed empirically: DuckDB rejects the
  # resulting double-aliased syntax) — the caller supplies
  # "AS c1(zone_id, lat, lon)"/"AS c2(zone_id, lat, lon)" instead.
  zone_centroids: |
    (VALUES
      (1, 37.793138, -122.398299),
      (2, 37.792440, -122.402033),
      (3, 37.791501, -122.405715),
      (4, 37.789965, -122.401984),
      (5, 37.788148, -122.406084),
      (6, 37.788932, -122.411797),
      (7, 37.786565, -122.411344),
      (8, 37.783310, -122.411409),
      (9, 37.780778, -122.417245),
      (10, 37.776782, -122.413964),
      (11, 37.781885, -122.407504),
      (12, 37.786278, -122.401971),
      (13, 37.788975, -122.398655),
      (14, 37.790870, -122.396233),
      (15, 37.792733, -122.393420),
      (16, 37.787831, -122.393680),
      (17, 37.784282, -122.390667),
      (18, 37.778451, -122.398286),
      (19, 37.772740, -122.405630),
      (20, 37.775169, -122.409826),
      (21, 37.781155, -122.402190),
      (22, 37.796397, -122.396233),
      (23, 37.801557, -122.400426),
      (24, 37.795657, -122.402656),
      (25, 37.795623, -122.406517)
    )

# ── Metrics ──────────────────────────────────────────────────────────────
# Five metrics, each → one Parquet file in summary/{name}.parquet.
# See data-model.md for the full column-level contract each one satisfies.

metrics:

  # FR-002(c): scalar KPIs for the Overview tab's value boxes.
  - name: summary_kpis
    description: Scalar KPIs for the Overview tab's value boxes
    sql: |
      SELECT
        (SELECT COUNT(DISTINCT household_id) FROM households) AS total_households,
        (SELECT COUNT(DISTINCT person_id)    FROM persons)    AS total_persons,
        (SELECT COUNT(DISTINCT trip_id)      FROM trips)      AS total_trips,
        (SELECT COUNT(DISTINCT tour_id)      FROM tours)      AS total_tours,
        (SELECT AVG(mode_choice_logsum)      FROM trips)      AS avg_trip_mode_choice_logsum,
        (SELECT COUNT(DISTINCT trip_id) FROM trips) * 1.0
          / (SELECT COUNT(DISTINCT household_id) FROM households) AS trips_per_household

  # FR-002(a): trips/tours by destination zone — makes the density
  # variant's real TAZ 1 destination-choice pull visible (User Story 1),
  # and is the basis of the $baseline diff panel (User Story 3).
  - name: trips_by_destination_zone
    description: Trips and tours aggregated by destination zone and purpose
    sql: |
      SELECT
        lu.zone_id       AS destination_zone_id,
        t.primary_purpose,
        COUNT(*)                  AS trips,
        COUNT(DISTINCT t.tour_id) AS tours
      FROM $sql.trips_merged
      GROUP BY lu.zone_id, t.primary_purpose

  # FR-002(b): trip mode share by time-of-day period — makes the transit
  # variant's real AM/PM WALK_LOC shift visible (User Story 2). Kept at
  # the real, ungrouped trip_mode (not major_trip_mode) since the whole
  # point is the WALK_LOC-specific shift, which grouping into "Transit"
  # would hide.
  - name: mode_share_by_period
    description: Trip mode share by real ActivitySim time-of-day period
    sql: |
      SELECT
        $bins.time_of_day_period AS time_of_day_period,
        t.trip_mode,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER (PARTITION BY $bins.time_of_day_period) AS share
      FROM trips t
      GROUP BY time_of_day_period, t.trip_mode

  # FR-002(d): overall trip mode share (not time-split) for the Overview tab.
  - name: trip_mode_share
    description: Overall trip mode share by grouped major mode category
    sql: |
      SELECT
        CASE t.trip_mode $mappings.major_trip_mode END AS major_trip_mode,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER () AS share
      FROM trips t
      GROUP BY major_trip_mode

  # FR-002(e): trip purpose breakdown for the Overview tab.
  - name: trip_purpose_share
    description: Trip counts and share by primary purpose
    sql: |
      SELECT
        t.primary_purpose,
        COUNT(*) AS trips,
        COUNT(*) * 1.0 / SUM(COUNT(*)) OVER () AS share
      FROM trips t
      GROUP BY t.primary_purpose

  # 031-all-panel-demo-content, User Story 2 (FR-006): real trip counts by
  # purpose x grouped mode, for the Sankey panel. Reuses two already-real,
  # already-proven columns (trip_purpose_share already groups by
  # primary_purpose; trip_mode_share already applies this exact
  # $mappings.major_trip_mode expansion) — no new source/mapping needed.
  # A full partition of `trips` with no WHERE — SUM(trips) over the whole
  # output equals the real total trip count for the scenario
  # (contracts/new-metrics.md's own invariant, covered by
  # python/tests/test_pipeline.py's new test_purpose_mode_flow_sums_to_
  # total_trips case).
  #
  # PENDING PUBLICATION — see CLAUDE.md's own 031-all-panel-demo-content
  # entry: this metric's SQL is real and correct, but no raw ActivitySim
  # input was available in the environment this was authored in to
  # actually run the pipeline and publish real Parquet output for it yet.
  - name: purpose_mode_flow
    description: Real trip counts by primary purpose and grouped major trip mode (Sankey source/target)
    sql: |
      SELECT
        t.primary_purpose,
        CASE t.trip_mode $mappings.major_trip_mode END AS major_trip_mode,
        COUNT(*) AS trips
      FROM trips t
      GROUP BY t.primary_purpose, major_trip_mode

  # 031-all-panel-demo-content, User Story 3 (FR-009): real origin-
  # destination trip flows with real MTC zone-centroid coordinates
  # (zone_centroids, above) for the FlowMap panel. Every orig_lat/
  # orig_lon/dest_lat/dest_lon value is byte-identical to the matching
  # zone_centroids row by construction (an equality JOIN on zone_id) —
  # contracts/new-metrics.md's own invariant.
  #
  # `t.origin` — NOT yet independently re-verified against a real raw
  # final_trips.csv in the environment this was authored in (no raw
  # ActivitySim input was available); written on the well-evidenced
  # basis that docs/GRAMMAR.md's own od_flows worked example already
  # references t.origin as ActivitySim's standard trip-table shape,
  # alongside t.destination, which this file's own trips_merged fragment
  # already confirms is real. MUST be confirmed directly against the real
  # file before this metric is ever run for real (per this feature's own
  # non-negotiable FR-001) — see CLAUDE.md's own 031 entry for the exact
  # remaining step.
  #
  # A real trip whose origin/destination falls outside zones 1-25 is
  # silently excluded by the inner JOINs below (not a separate filter) —
  # SUM(trips) here may legitimately be less than the real total trip
  # count; this MUST be checked empirically once real data is available,
  # not assumed either way (contracts/new-metrics.md).
  #
  # PENDING PUBLICATION — same status as purpose_mode_flow above.
  - name: od_flows
    description: Real origin-destination trip flows with real MTC zone-centroid coordinates
    sql: |
      SELECT
        t.origin      AS orig_taz,
        t.destination AS dest_taz,
        CAST(c1.lat AS DOUBLE) AS orig_lat, CAST(c1.lon AS DOUBLE) AS orig_lon,
        CAST(c2.lat AS DOUBLE) AS dest_lat, CAST(c2.lon AS DOUBLE) AS dest_lon,
        COUNT(*) AS trips
      FROM trips t
      JOIN $sql.zone_centroids AS c1(zone_id, lat, lon) ON t.origin      = c1.zone_id
      JOIN $sql.zone_centroids AS c2(zone_id, lat, lon) ON t.destination = c2.zone_id
      GROUP BY t.origin, t.destination, c1.lat, c1.lon, c2.lat, c2.lon
