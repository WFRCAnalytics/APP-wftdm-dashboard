# Second fixture tab — minimal on purpose. Exists so the Playwright suite
# can exercise real multi-tab navigation (SC-001's "at least two different
# configured tab counts") without duplicating dashboard-1-summary.yaml's
# panel content. Also hosts a deliberately-broken panel (SC-006/FR-010)
# so the same fixture set exercises panel-scoped error isolation without
# a third file.

header:
  tab: Detail
  title: Detail View

layout:
  row_kpis:
    - type: valuebox
      title: Average Trip Distance
      metric: summary_kpis
      column: avg_trip_distance
      format: "{:.1f}"
      unit: miles
      icon: map-pin
      width: 0.5

    # Deliberately broken — points at a metric no scenario publishes.
    # SC-006: this panel's failure MUST NOT prevent "Average Trip
    # Distance" (above) from rendering correctly.
    - type: valuebox
      title: Broken Panel (intentional)
      metric: nonexistent_metric
      column: whatever
      format: "{:.0f}"
      width: 0.5

  # 014-graphic-walker-panel — the ninth and last originally-listed panel
  # type. Bound to trip_mode_share, the same dataset name docs/GRAMMAR.md's
  # own worked example already uses, and a table generate.py already
  # writes into the "good" scenario — no fixture data changes needed
  # (research.md §8). `scenario: good_scenario` pinned on the two main
  # panels below, matching this file's own already-established convention
  # (every panel across this fixture set pins `scenario:`/`scenarios:`
  # rather than relying on global active-scenario state, which only
  # `observed` gets by default — confirmed live during implementation:
  # a first, unpinned draft of this panel produced a real "Catalog Error:
  # Table with name observed__trip_mode_share does not exist" failure,
  # since `observed`'s own fixture data never published that dataset).
  # Each graphic-walker panel gets its OWN row, not a shared row_explore —
  # a real, confirmed layout finding from live implementation:
  # dashboardRenderer.tsx's own width handling (gridTemplateColumns built
  # from EACH panel's width as a `fr` unit — comment there explains why,
  # 003's own research.md) treats `width` as a fraction of the OTHER
  # panels sharing its row, not of the page — four panels all at
  # `width: 1.0` in one row rendered as four equal quarter-width columns,
  # confirmed via a real screenshot during this feature's own
  # implementation, not merely inferred from reading the code. Graphic
  # Walker's own multi-shelf UI genuinely does NOT fit in a quarter-width
  # card (its X-Axis/Y-Axis shelves were confirmed, live, to render
  # past the card's own right edge at that width) — one row each is both
  # the fix and the realistic authoring pattern this panel type needs.
  row_explore_1:
    - type: graphic-walker
      title: Free-form Visual Analytics
      dataset: trip_mode_share
      scenario: good_scenario
      width: 1.0
      # 034-metric-panel-redesign (Part A): graphic-walker is no longer
      # expandable by DEFAULT (FR-002) — this panel's own User Story 3
      # coverage below (graphicWalkerPanel.spec.ts) specifically exercises
      # the 004 expand-to-dialog mechanism against an in-progress
      # GraphicWalker chart, so it opts back in via the new per-panel
      # override (FR-023) rather than being rewritten to drop that
      # coverage.
      expandable: true

  # A second instance, deliberately bound to a different dataset — US2's
  # own "no cross-contamination between two panel instances" coverage
  # (FR-010) needs two real, differently-configured panels to compare.
  row_explore_2:
    - type: graphic-walker
      title: Free-form Visual Analytics (Screenlines)
      dataset: screenlines
      scenario: good_scenario
      width: 1.0

  # Deliberately broken — names a dataset no scenario publishes, the
  # same "intentional" convention the valuebox panel above already uses.
  row_explore_3:
    - type: graphic-walker
      title: Explore Panel Broken (intentional)
      dataset: nonexistent_dataset
      width: 1.0

  # No scenario: pin — exercises the $scenario. multi-scenario UNION ALL
  # path (US2 Acceptance Scenario 3, FR-004). dataset: summary_kpis is
  # the one dataset generate.py publishes under BOTH observed (always
  # active) and good_scenario (activated via this test's own ?s= URL
  # param) — trip_mode_share/screenlines only exist under good_scenario,
  # so they can't exercise a genuine two-scenario union at all.
  row_explore_4:
    - type: graphic-walker
      title: Free-form Visual Analytics (Multi-Scenario)
      dataset: summary_kpis
      width: 1.0

  # limit: 0 — a deterministic, real (not synthetic/mocked) way to force a
  # zero-row result without needing any new fixture data: DuckDB executes
  # `LIMIT 0` normally, returning a real empty result set (FR-009).
  row_explore_5:
    - type: graphic-walker
      title: Free-form Visual Analytics Empty (intentional)
      dataset: trip_mode_share
      scenario: good_scenario
      limit: 0
      width: 1.0

  # fields: override — purpose (auto-inferred nominal/dimension) forced to
  # quantitative/measure (FR-007). @kanaries/graphic-walker's own
  # draggable-id convention is `${analyticType}_${fid}` (confirmed live
  # during implementation), so a successful override is directly,
  # robustly observable as `measure_purpose` replacing `dimension_purpose`
  # in the rendered DOM — not just an assumed internal state change.
  row_explore_6:
    - type: graphic-walker
      title: Free-form Visual Analytics Override (intentional)
      dataset: trip_mode_share
      scenario: good_scenario
      fields:
        - fid: purpose
          semanticType: quantitative
          analyticType: measure
      width: 1.0

  # 028-graphic-walker-dataset-picker — viewer-selectable dataset picker,
  # opt-in via dataset_picker: true. Pinned to good_scenario (like the two
  # main 014-era panels above), so the picker's own available-dataset list
  # is scoped to that one scenario alone (research.md §5) — every metric
  # generate.py publishes under good_scenario: od_flows, screenlines,
  # summary_kpis, tour_mode_to_trip_mode, trip_destination_dist,
  # trip_mode_share, vmt_by_home_taz.
  row_explore_7:
    - type: graphic-walker
      title: Free-form Visual Analytics (Dataset Picker)
      dataset: trip_mode_share
      scenario: good_scenario
      dataset_picker: true
      width: 1.0

  # No scenario: pin — the picker's own available-dataset list is the
  # INTERSECTION across every currently active scenario (research.md §3).
  # With both `observed` (always active) and `good_scenario` (activated via
  # ?s=good_scenario) active, summary_kpis/vmt_by_home_taz are the only two
  # datasets generate.py publishes under BOTH — trip_mode_share/screenlines/
  # etc. are good_scenario-only and MUST NOT appear as a picker option (a
  # guaranteed-to-fail $scenario. union otherwise — FR-005).
  row_explore_8:
    - type: graphic-walker
      title: Free-form Visual Analytics (Dataset Picker, Multi-Scenario)
      dataset: summary_kpis
      dataset_picker: true
      width: 1.0

  # Deliberately broken, matching this file's existing "(intentional)"
  # convention — pinned to a scenario that was never registered at all, so
  # listSelectableDatasets() has nothing to intersect against and returns
  # []. Exercises the picker's own empty/disabled-state rendering (spec.md
  # Edge Cases) with no new scenario fixture data needed.
  row_explore_9:
    - type: graphic-walker
      title: Free-form Visual Analytics (Dataset Picker, No Match) (intentional)
      dataset: summary_kpis
      scenario: nonexistent_scenario_zzz
      dataset_picker: true
      width: 1.0

  # 019-baseline-diff-consumption's own zonemap $baseline coverage —
  # deliberately placed HERE, not dashboard-1-summary.yaml's own
  # row_zonemap (right alongside its sibling comparison: diff panels,
  # which would have been the more obviously-thematic location). A
  # single-run git-stash comparison first suggested adding one more
  # WebGL-context-consuming zonemap panel to that already context-heavy
  # Summary tab (host to 012-webgl-context-management's own flowmap/
  # zonemap context-ceiling tests) was destabilizing that feature's own
  # real-context-loss simulation test. A larger, repeated-run comparison
  # afterward (4 runs each side) disproved that: the test fails at a
  # similar rate (roughly 1 in 3-4 runs) with or without this panel
  # present there, including on the clean pre-019 commit — genuine,
  # pre-existing flakiness, not something this feature caused. Left here
  # anyway as a harmless precaution (this tab has zero map-rendering
  # panels of its own), but this placement is NOT a proven fix for
  # anything — see dashboard-1-summary.yaml's own matching comment for
  # the full, corrected record. Same real, hand-verifiable
  # observed(flat 5.0)/good_scenario data
  # tests/fixtures/dashboard-config/dashboard-1-summary.yaml's own
  # hardcoded-name zonemap diff panel uses, but `a` references the
  # '$baseline' sentinel instead of a literal scenario name. Tests
  # explicitly call window.__wftdm.appState.setBaseline('observed') before
  # asserting — which scenario this resolves against is a live, test-
  # controlled variable, not fixed at fixture-authoring time. metric_id
  # doubles as compare_on's default (omitted here deliberately,
  # research.md §7).
  row_baseline_diff:
    - type: zonemap
      title: Zone Map VMT Diff via $baseline
      metric: vmt_by_home_taz
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      label: VMT / Capita Diff
      color_scale: diverging
      domain: [-15, 25]
      comparison:
        type: diff
        a: "$baseline"
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      center: [-111.925, 40.705]
      zoom: 11
      height: 450
      width: 1.0
