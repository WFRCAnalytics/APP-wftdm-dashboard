# Third fixture tab — 011-basemap-style-system. Dedicated to basemap
# precedence/composition/fallback coverage, kept separate from
# dashboard-1-summary.yaml's own flowmap panel (which stays basemap-config-
# free, exercising the app-default/theme-pairing path and the empirical
# setStyle()/overlay-survival test — see flowmapPanel.spec.ts). All panels
# here reuse od_flows/good_scenario's existing field mapping — same
# convention as dashboard-1-summary.yaml's own flowmap panels — since this
# tab is about basemap behavior, not data variety.

header:
  tab: Basemaps
  title: Basemap Precedence and Composition

# Tab-level default (FR-005) — every flowmap panel below that doesn't set
# its own `basemap:` picks this up instead of the app's light/dark pairing.
default_basemap: openfreemap-bright

layout:
  row_precedence:
    # No panel-level basemap: — resolves to the TAB default above, not the
    # app's light/dark CARTO pairing (quickstart.md Scenario 3, row 2).
    - type: flowmap
      title: Flowmap Tab Default Basemap
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      height: 400
      width: 0.5

    # Panel-level basemap: WINS over the tab default (quickstart.md
    # Scenario 3, row 3) — also the vehicle for T022's "an explicit pin
    # does not re-pair on theme change, and setStyle() is not called a
    # second time" test.
    - type: flowmap
      title: Flowmap Panel Basemap Override
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: carto-voyager
      height: 400
      width: 0.5

    # 027-map-auto-fit-and-reset (US3/FR-003) — an explicit center/zoom
    # deliberately far from this panel's own real flow data (which spans
    # roughly lon -112.00..-111.75 / lat 40.60..40.85, generate.py's
    # OD_FLOWS_ROWS) must still win outright: auto-fit must never run for
    # this panel at all. No existing flowmap fixture panel had an explicit
    # center/zoom before this feature — every other panel in this tab
    # configures `basemap:` but not `center`/`zoom` — so this is genuinely
    # new fixture content, not a repurposed existing panel.
    - type: flowmap
      title: Flowmap Explicit View Override
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      center: [-110.0, 39.0]
      zoom: 6
      height: 400
      width: 0.5

  row_sources:
    # A real leaflet-providers raster preset, dotted provider.variant
    # form — confirmed present in the real extracted catalog
    # (public/basemap/leaflet-providers.json) during implementation.
    - type: flowmap
      title: Flowmap Raster Provider Preset
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: OpenTopoMap
      height: 400
      width: 0.5

    # Deliberately unreachable preset name — FR-010's uniform blank-style
    # fallback (quickstart.md Scenario 5, default-path subset, but
    # exercised here via an explicit panel-level pin rather than the
    # app-default path dashboard-1-summary.yaml's own broken-panel
    # equivalent would use).
    - type: flowmap
      title: Flowmap Unreachable Basemap (intentional)
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: totally-made-up-preset-name
      height: 400
      width: 0.5

  row_composition:
    # Real UGRC Vector Lite Base Map endpoints (org 99lidPhWCzftIe9K) —
    # confirmed reachable and MapLibre-spec-compatible by direct fetch
    # during this feature's own research (research.md, quickstart.md
    # Scenario 6). This string never appears in
    # src/panels/basemap/registry.ts (FR-012) — fixture-only, same status
    # any downstream author's own composition would have.
    #
    # Two layers (LiteBase + LiteLabels), not the originally-planned
    # three: VectorHillshade's own real vector tile data was confirmed,
    # during implementation, to trigger a genuine, real PBF-parsing
    # incompatibility with this project's pinned maplibre-gl version —
    # "Unimplemented type: 3", thrown by maplibre-gl's own vendored `pbf`
    # reader when it hits a deprecated Protobuf wire type (group
    # start/end) that reader doesn't implement. Confirmed directly: (1)
    # the error traces to maplibre-gl's own bundled pbf library's error
    # message, not any code in this feature; (2) removing VectorHillshade
    # alone (keeping only LiteBase + LiteLabels) eliminates the error
    # entirely, composing and rendering cleanly. This is a real, external
    # tile-encoding incompatibility between Esri's VectorHillshade service
    # specifically and MapLibre's vector-tile parser — not a bug in
    # composeStyles() or anything else this feature owns, and not
    # something this feature's own scope extends to fixing (it would
    # require either a MapLibre upgrade with broader wire-type support, or
    # Esri changing that one service's tile encoding). The composition
    # mechanism itself (FR-006/FR-008/FR-012) is still fully proven here
    # against two real, independently-hosted services.
    - type: flowmap
      title: Flowmap UGRC Composition
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap:
        layers:
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/LiteBase/VectorTileServer/resources/styles/root.json
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/LiteLabels/VectorTileServer/resources/styles/root.json
      height: 400
      width: 1.0

    # One deliberately-unreachable composition layer — the whole basemap
    # MUST fall back to BLANK_STYLE, never a partial composite (User
    # Story 3's own Acceptance Scenario 3, quickstart.md Scenario 5,
    # composition-path subset).
    - type: flowmap
      title: Flowmap Broken Composition Layer (intentional)
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap:
        layers:
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/LiteBase/VectorTileServer/resources/styles/root.json
          - https://127.0.0.1:1/unreachable-layer.json
      height: 400
      width: 1.0

  row_more_composition:
    # A SECOND, genuinely different real UGRC composition, distinct from
    # BOTH the existing "Flowmap UGRC Composition" panel below AND the
    # real "Vector Hybrid" panel further down this file. This org's own
    # ArcGIS services directory (99lidPhWCzftIe9K) has no VECTOR-ONLY
    # service literally named "Hybrid" — confirmed directly, fetched.
    # OutdoorsBase + Outdoors_Labels are real, ungated vector tile
    # services at this SAME already-proven org (confirmed reachable,
    # valid MapLibre-spec version 8 style documents, same relative-URL
    # shape as LiteBase/LiteLabels above) — a genuinely different real
    # endpoint pair, not a duplicate of the
    # existing "Flowmap UGRC Composition" panel.
    - type: flowmap
      title: Flowmap UGRC Outdoors Composition
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap:
        layers:
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/OutdoorsBase/VectorTileServer/resources/styles/root.json
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/Outdoors_Labels/VectorTileServer/resources/styles/root.json
      height: 400
      width: 1.0

  row_more_presets:
    # Confirmed present in registry.ts's own BUILT_IN_PRESETS (FR-001).
    - type: flowmap
      title: Flowmap Dark Matter Preset
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: carto-dark-matter
      height: 400
      width: 0.33

    - type: flowmap
      title: Flowmap OpenFreeMap Liberty Preset
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: openfreemap-liberty
      height: 400
      width: 0.33

    # A SECOND leaflet-providers raster preset, genuinely different from
    # the existing OpenTopoMap panel — a real, present dotted
    # provider.variant entry confirmed directly against a freshly
    # regenerated public/basemap/leaflet-providers.json (Esri is a
    # PARENT entry with a `variants` map; `WorldImagery`'s own variant
    # value substitutes `variant: "World_Imagery"` into Esri's parent
    # tile URL template — no {s} subdomain placeholder needed for this
    # one, unlike OpenTopoMap).
    - type: flowmap
      title: Flowmap Esri World Imagery Preset
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap: Esri.WorldImagery
      height: 400
      width: 0.33

  row_hybrid_composition:
    # The REAL UGRC "Utah Vector Hybrid Base Map"
    # (opendata.gis.utah.gov/datasets/utah-vector-hybrid-base-map) — a
    # real, ungated ArcGIS Online web map (item id
    # ed173e51c27b41f3882064ce5de7d431, owner UtahAGRC), confirmed by
    # fetching that item's own real data JSON directly rather than
    # assumed: it composes Esri's World_Imagery (a RASTER ArcGIS
    # MapServer, https://services.arcgisonline.com/ArcGIS/rest/services/
    # World_Imagery/MapServer — resolved here via the SAME
    # "Esri.WorldImagery" leaflet-providers name the panel above uses,
    # not this literal MapServer URL, since a raw MapServer endpoint
    # isn't itself a MapLibre style document) underneath UGRC's own
    # Vector_Overlay — a real VECTOR tile service at the SAME org as
    # every other UGRC panel on this tab (99lidPhWCzftIe9K), confirmed
    # to be a valid MapLibre-spec style document with NO background
    # layer of its own (by design — it's meant to sit over imagery, not
    # stand alone). This is genuinely different from every other
    # composition on this tab: the first mix of a raster layer with a
    # vector layer in one basemap, requiring composeStyles() to actually
    # gain a new capability (a composition layer entry may now be a
    # raster provider preset name, not only a URL) — see that function's
    # own comment in loadBasemapStyle.ts for the full reasoning.
    - type: flowmap
      title: Flowmap UGRC Vector Hybrid
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      basemap:
        layers:
          - Esri.WorldImagery
          - https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/Vector_Overlay/VectorTileServer/resources/styles/root.json
      height: 400
      width: 1.0

  # 013-zonemap-panel — same tab-default/panel-override/unreachable-
  # fallback coverage as row_precedence's flowmap panels above, extended
  # to the second (and final) map-rendering panel type, proving
  # panels/basemap/'s panel > tab > app-default precedence (011) and the
  # "a missing/unreachable basemap never blocks a panel's own data-driven
  # content" guarantee (011/012) are genuinely generic across panel
  # types, not flowmap-specific in practice (spec.md Grammar findings
  # #6). Reuses good_scenario/vmt_by_home_taz + taz.geoparquet — same
  # convention as row_precedence reusing od_flows/good_scenario.
  row_zonemap_basemaps:
    # No panel-level basemap: — resolves to the TAB default
    # (openfreemap-bright, set at the top of this file), not the app's
    # light/dark CARTO pairing.
    - type: zonemap
      title: Zone Map Tab Default Basemap
      metric: vmt_by_home_taz
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      color_scale: sequential
      height: 400
      width: 0.5

    # Panel-level basemap: WINS over the tab default.
    - type: zonemap
      title: Zone Map Panel Basemap Override
      metric: vmt_by_home_taz
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      color_scale: sequential
      basemap: carto-voyager
      height: 400
      width: 0.5

    # Deliberately unreachable preset name — the choropleth itself must
    # still render (falls back to the blank basemap background), a
    # basemap failure never blocks the panel's own data-driven content
    # (spec.md SC-004, extending 011/012's existing guarantee to this
    # panel type).
    - type: zonemap
      title: Zone Map Unreachable Basemap (intentional)
      metric: vmt_by_home_taz
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      color_scale: sequential
      basemap: totally-made-up-preset-name
      height: 400
      width: 0.5
