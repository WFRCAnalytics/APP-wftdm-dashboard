# Fixture dashboard-*.yaml for 003-dashboard-shell-navigation's Playwright
# suite (research.md §1) — real docs/GRAMMAR.md-shaped grammar, bound to
# tests/fixtures/generate.py's existing Parquet columns (summary_kpis:
# total_households/total_persons/total_trips/purpose_count/
# avg_trip_distance; trip_mode_share: purpose/mode/share). Copied to
# public/dashboard-config/ by tests/global-setup.js, same convention as
# the observed/scenarios fixtures.

header:
  tab: Summary
  title: Model Run Summary
  description: Fixture dashboard exercising valuebox and plotly panels end to end

filters:
  - id: purpose
    label: Trip Purpose
    type: select
    source: trip_mode_share
    column: purpose
    default: all
    all_option: true

layout:
  row_kpis:
    - type: valuebox
      title: Total Households
      metric: summary_kpis
      column: total_households
      format: "{:,.0f}"
      icon: house
      width: 0.5

    - type: valuebox
      title: Total Trips
      metric: summary_kpis
      column: total_trips
      format: "{:,.0f}"
      icon: route
      width: 0.5
      # 034-metric-panel-redesign, Part A addendum (FR-023): explicit
      # per-panel override — a valuebox panel normally has NO expand
      # control by default (see "Total Households" above, unchanged),
      # but this one opts back in. panelExpand.spec.ts's own override
      # test relies on this fixture specifically.
      expandable: true

  # 034-metric-panel-redesign (US3/US4) — sparkline/baseline_trend fixture
  # panels. All pinned to `scenario: good_scenario` explicitly — `observed`
  # never publishes trip_mode_share at all (only summary_kpis/
  # vmt_by_home_taz — generate.py's own real file list), so an unpinned
  # $scenario union would throw a real Catalog Error the instant a
  # sparkline queried it, matching this project's own established
  # single-scenario-pin convention.
  row_valuebox_trends:
    - type: valuebox
      title: ValueBox Mode Share Sparkline
      metric: summary_kpis
      scenario: good_scenario
      column: total_trips
      format: "{:,.0f}"
      sparkline:
        metric: trip_mode_share
        x: mode
        y: share
      width: 0.33

    # Deliberately broken sparkline metric — proves a sparkline failure
    # never blocks the panel's own primary scalar value (FR-013).
    - type: valuebox
      title: ValueBox Sparkline Broken (intentional)
      metric: summary_kpis
      scenario: good_scenario
      column: total_households
      format: "{:,.0f}"
      sparkline:
        metric: nonexistent_sparkline_metric
        x: a
        y: b
      width: 0.33

    # Real, hand-verifiable nonzero baseline diff. A real, confirmed
    # fixture constraint (not an oversight): generate.py's own
    # SUMMARY_KPIS_ROWS is written VERBATIM for both `observed` and
    # `good_scenario` — every real column is IDENTICAL between them in
    # this fixture set, so a same-column diff (e.g. total_households -
    # total_households) is always exactly 0 regardless of which two
    # scenarios are compared, which would make this test indistinguishable
    # from the deliberate "no change" fixture below. `expr` deliberately
    # compares two DIFFERENT real columns instead (a.total_trips -
    # b.total_persons = 9200 - 3800 = 5400, hand-verified against
    # generate.py's own SUMMARY_KPIS_ROWS/COLUMNS directly) — a
    # semantically arbitrary combination, but a genuine, deterministic,
    # non-zero SQL computation proving the real a/b-scenario-view
    # resolution and cross-join mechanism work correctly end-to-end, which
    # is what this test actually needs to prove.
    - type: valuebox
      title: ValueBox Baseline Trend
      metric: summary_kpis
      scenario: good_scenario
      column: total_households
      format: "{:,.0f}"
      baseline_trend:
        expr: "a.total_trips - b.total_persons"
        format: "{:,.0f}"
      width: 0.34

    # baseline_trend configured with NO scenario: pinned — the real,
    # documented configuration-error case (research.md §3: a value box's
    # "current" side is always its pinned scenario; there is no
    # unambiguous comparison without one).
    - type: valuebox
      title: ValueBox Baseline Trend No Scenario (intentional)
      metric: summary_kpis
      column: total_households
      format: "{:,.0f}"
      baseline_trend:
        expr: "a.total_households - b.total_households"
      width: 0.33

    # The resolved baseline scenario IS this panel's own scenario — the
    # "comparing baseline against itself" edge case (spec.md Edge Cases).
    # A real per-column diff (not the cross-column trick above) is exactly
    # right here — the SAME view aliased twice always self-diffs to 0.
    - type: valuebox
      title: ValueBox Baseline Trend Self (intentional)
      metric: summary_kpis
      scenario: observed
      column: total_households
      format: "{:,.0f}"
      baseline_trend:
        expr: "a.total_households - b.total_households"
      width: 0.33

    # Both trend modes configured together (spec.md Edge Cases) — proves
    # neither crowds out the primary value or the other.
    - type: valuebox
      title: ValueBox Both Trends
      metric: summary_kpis
      scenario: good_scenario
      column: total_trips
      format: "{:,.0f}"
      sparkline:
        metric: trip_mode_share
        x: mode
        y: share
      baseline_trend:
        expr: "a.total_trips - b.total_persons"
        format: "{:,.0f}"
      width: 0.34

  row_chart:
    - type: plotly
      title: Mode Share by Purpose
      metric: trip_mode_share
      filter: $filters.purpose
      # observed only publishes summary_kpis in this fixture set (real
      # convention too, per CLAUDE.md — observed's comparison data lives
      # in separately-named files like observed_mode_share.parquet,
      # joined via a panel's own `observed:` key, not unioned into
      # $scenario.trip_mode_share). Scoped to good_scenario explicitly
      # so this panel's $scenario.x union only spans scenarios that
      # actually publish trip_mode_share — exercises the `scenarios:`
      # (plural) override for real, not just in the unit tests.
      scenarios: [good_scenario]
      height: 400
      traces:
        - type: bar
          x: $metric.purpose
          y: $metric.share
          color: $metric.mode
          barmode: group
      width: 1.0

  # 005-table-panel: docs/GRAMMAR.md's own type: table example
  # (screenline validation) reused directly, bound to generate.py's
  # SCREENLINES_ROWS (30 rows — exceeds the default page size of 20, so
  # pagination and cross-page search are meaningfully exercised, not just
  # plausible in theory). Two panels, deliberately non-overlapping in
  # what each exercises rather than one panel trying to cover everything:
  row_table:
    # Full columns: config — labels, per-column format, a diverging
    # color_scale (domain matches this fixture's actual pct_error range,
    # [-0.5, 0.5]), a declared initial sort, and an explicit pagination
    # override. Deliberately NOT searchable — the negative case for "a
    # panel without searchable renders no search input".
    - type: table
      title: Screenline Validation
      metric: screenlines
      scenarios: [good_scenario]
      sort: { column: pct_error, order: desc }
      pagination: 10
      columns:
        - { field: link_id, label: Link ID }
        - { field: facility_type, label: Facility }
        - { field: observed, label: Observed, format: "{:,.0f}" }
        - { field: modeled, label: Modeled, format: "{:,.0f}" }
        - { field: pct_error, label: "% Error", format: "{:.1%}",
            color_scale: diverging, domain: [-0.5, 0.5] }
      width: 1.0
      # 034-metric-panel-redesign, Part A addendum (FR-023): explicit
      # per-panel override — a table panel normally HAS an expand
      # control by default, but this one opts out. panelExpand.spec.ts's
      # own override test relies on this fixture specifically; no other
      # test in that file references "Screenline Validation".
      expandable: false

    # No columns: config (derived from the query result's own shape) and
    # searchable — the vehicle for the cross-page search test: row L025
    # (facility_type "Ramp", the only row with that value) sits at fetch
    # index 24, on page 2 of 2 at this panel's default page size (20),
    # since no sort: config here means natural fetch order.
    - type: table
      title: Screenline Validation (Raw)
      metric: screenlines
      scenarios: [good_scenario]
      searchable: true
      width: 1.0

    # Deliberately broken — points at a metric no scenario publishes.
    # Exercises TablePanel.tsx's own error branch (a rejected query),
    # distinct from the empty-result branch above — same convention as
    # dashboard-2-detail.yaml's "Broken Panel (intentional)" valuebox.
    - type: table
      title: Broken Table Panel (intentional)
      metric: nonexistent_screenline_metric
      scenarios: [good_scenario]
      width: 1.0

  # 006-markdown-panel: docs/GRAMMAR.md's own type: markdown grammar
  # (a literal content: block, no metric/scenario/filter at all). Four
  # panels, each exercising a distinct, non-overlapping property rather
  # than one panel trying to cover everything — same convention as
  # row_table above. Landing in this same file (rather than a new
  # fixture file) deliberately puts markdown panels on the same tab as
  # valuebox/plotly/table panels, so US3's "mixed panel types on one
  # tab render without error" coverage comes for free from this file
  # already being exercised by 003's/004's/005's own suites.
  row_markdown:
    # CommonMark/GFM element coverage: headings, bold/italic, ordered and
    # unordered lists, a link (deliberately with no author-written
    # target:/rel: — proves the afterSanitizeAttributes hook applies to
    # the common case, research.md §6), a GFM pipe-table, and a code span.
    - type: markdown
      title: Methodology Notes
      content: |
        ## Highway Assignment Validation

        Screenline volumes compared against **UDOT AADT counts** (2019
        base year). Acceptable error bands: *±10%* for facilities with
        more than 10,000 AADT.

        Key inputs:
        1. Observed counts from the [UDOT traffic count program](https://example.com/udot-counts)
        2. Modeled volumes from `summary_kpis.parquet`
        3. Facility type crosswalk

        - Freeway
        - Arterial
        - Collector

        | Facility Type | Threshold |
        |---|---|
        | Freeway | ±10% |
        | Arterial | ±15% |
        | Collector | ±20% |
      width: 1.0

    # Deliberately unsafe — a literal <script> tag, an element with an
    # onerror handler, and legitimate markdown mixed in alongside both.
    # Exercises US2's sanitization requirement (FR-003): the script must
    # not execute, the handler must not fire, and the legitimate heading/
    # paragraph text must still render correctly regardless.
    - type: markdown
      title: Markdown XSS Payload (intentional)
      content: |
        ## Still Renders Safely

        This paragraph is legitimate markdown and should render normally.

        <script>window.__xssFired = true</script>

        <img src="x" onerror="window.__xssFired = true">

        This paragraph comes after the unsafe fragments and should also
        render normally.
      width: 1.0

    # No content: key at all — exercises FR-006's empty state.
    - type: markdown
      title: Markdown Empty (intentional)
      width: 1.0

    # content: present but whitespace-only — exercises the same empty
    # state via the .trim() check, not merely a falsy/empty-string check.
    - type: markdown
      title: Markdown Whitespace-Only (intentional)
      content: "   "
      width: 1.0

  # 007-observable-plot-panel: docs/GRAMMAR.md's own type: observable-plot
  # grammar, including panel-local `inputs:` (real, documented grammar —
  # spec.md's Grammar findings, research.md §2/§3/§9). Six panels, each
  # exercising a distinct, non-overlapping property — same convention as
  # row_table/row_markdown above. Landing in this same file puts these
  # panels on the same tab as valuebox/plotly/table/markdown, so US3's
  # "mixed panel types on one tab render without error" coverage comes for
  # free from this file already being exercised by every prior feature's
  # own suite.
  row_observable_plot:
    # US1's primary vehicle: mark: barY bound to trip_mode_share, reactive
    # to the existing global purpose filter — no inputs: at all, proving
    # the static query-render pipeline works before any panel-local input
    # exists (spec.md's own reasoning for scoping US1 independently of US2).
    # tip: true — real, documented grammar (docs/GRAMMAR.md's common
    # encoding channels), not mark-restricted; exercises the barY-specific
    # tip-mode handling in observablePlotEncoding.ts (a real hover bug
    # found post-implementation: barY's dead-spot caveat, resolved
    # internally, not by inventing new author-facing grammar).
    - type: observable-plot
      title: Observable Plot Mode Share (Bar)
      metric: trip_mode_share
      scenario: good_scenario
      mark: barY
      x: purpose
      y: share
      fill: mode
      tip: true
      filter:
        purpose: $filters.purpose
      height: 350
      width: 1.0

    # Reuses docs/GRAMMAR.md's own Trip Length Frequency Distribution
    # example verbatim, including tip: true and grid: true — an earlier
    # version of this fixture silently dropped both, which is why hover
    # tooltips never actually worked on any observable-plot panel despite
    # this feature's own contract/tests describing tip support (a real,
    # confirmed post-implementation bug: the fixture never enabled it).
    - type: observable-plot
      title: Trip Length Frequency Distribution
      metric: trip_destination_dist
      scenario: good_scenario
      mark: lineY
      x: distance_bin
      y: trips
      stroke: purpose
      tip: true
      grid: true
      inputs:
        - id: mode_select
          label: Mode
          type: select
          column: mode
          default: SOV
      filter:
        purpose: $filters.purpose
        mode: $inputs.mode_select
      height: 350
      width: 1.0

    # Deliberately reuses the SAME input id (mode_select) as the panel
    # above, as a multiselect this time — the vehicle for the cross-panel
    # isolation-under-collision test (spec.md's own named edge case) and
    # multiselect "any of" coverage.
    - type: observable-plot
      title: Observable Plot Mode Share (Multiselect Filter)
      metric: trip_mode_share
      scenario: good_scenario
      mark: barY
      x: purpose
      y: share
      inputs:
        - id: mode_select
          label: Mode
          type: multiselect
          column: mode
          default: SOV
      filter:
        purpose: $filters.purpose
        mode: $inputs.mode_select
      height: 350
      width: 1.0

    # range-type input coverage. default: 99 is deliberately outside this
    # column's real [1, 5] domain — this panel's own initial render
    # directly exercises the browser's native <input type="range">
    # clamping behavior (research.md §9) rather than needing a second,
    # otherwise-redundant range fixture.
    - type: observable-plot
      title: Trip Length by Distance Bin (Range Filter)
      metric: trip_destination_dist
      scenario: good_scenario
      mark: barY
      x: mode
      y: trips
      inputs:
        - id: distance_picker
          label: Distance Bin
          type: range
          column: distance_bin
          default: "99"
      filter:
        distance_bin: $inputs.distance_picker
      height: 350
      width: 1.0

    # Deliberately mismatched select default (research.md §9, spec.md's
    # Edge Cases) — "Bike" matches no row in trip_mode_share.mode, so this
    # legitimately produces a zero-row result on load. Doubles as the
    # empty-state fixture (US1) and the mismatched-select-default fixture
    # (US2).
    - type: observable-plot
      title: Mode Share (Mismatched Default, intentional)
      metric: trip_mode_share
      scenario: good_scenario
      mark: barY
      x: purpose
      y: share
      inputs:
        - id: mode_filter_bad
          label: Mode
          type: select
          column: mode
          default: Bike
      filter:
        mode: $inputs.mode_filter_bad
      height: 350
      width: 1.0

    # Deliberately broken — points at a metric no scenario publishes.
    # Exercises ObservablePlotPanel.tsx's own error branch, same
    # convention as row_table's/row_markdown's own "Broken Panel
    # (intentional)" entries.
    - type: observable-plot
      title: Observable Plot Broken Panel (intentional)
      metric: nonexistent_observable_metric
      scenario: good_scenario
      mark: barY
      x: a
      y: b
      height: 350
      width: 1.0

  # 008-sankey-panel — the sixth and final originally-listed panel type.
  # tour_mode_to_trip_mode is docs/GRAMMAR.md's own worked sankey example's
  # metric name; source/target/value map to its tour_mode/trip_mode/trips
  # columns verbatim (Grammar findings #1/#2). No title here shares a
  # prefix with any pre-existing panel title in this file (checked against
  # the full list before choosing these — see tasks.md T004) — avoids the
  # exact non-exact-getByText/getByRole collision class 007's own fixture
  # additions ran into.
  row_sankey:
    # Primary US1/US2 vehicle: direct-aggregation-match assertion, the
    # corrected same-value-row behavior (SOV -> SOV is this fixture's
    # single largest row — research.md §4), a named color_scheme, global
    # filter reactivity, the excludedCount/console.warn signal (the
    # Non-Motorized -> SOV row has a negative trips value), and 004
    # expand/resize correctness.
    - type: sankey
      title: Sankey Tour-to-Trip Mode Consistency
      metric: tour_mode_to_trip_mode
      scenario: good_scenario
      source: tour_mode
      target: trip_mode
      value: trips
      color_scheme: Tableau10
      filter:
        purpose: $filters.purpose
      height: 400
      width: 1.0

    # Same metric/source/target/value as above, color_scheme omitted — the
    # token-derived-fallback-palette vehicle (research.md §6, spec.md US1
    # Acceptance Scenario 3).
    - type: sankey
      title: Sankey Mode Consistency (No Color Scheme)
      metric: tour_mode_to_trip_mode
      scenario: good_scenario
      source: tour_mode
      target: trip_mode
      value: trips
      height: 400
      width: 1.0

    # Deliberately broken — points at a metric no scenario publishes.
    # Same convention as row_table's/row_markdown's/row_observable_plot's
    # own "Broken Panel (intentional)" entries.
    - type: sankey
      title: Sankey Broken Panel (intentional)
      metric: nonexistent_sankey_metric
      scenario: good_scenario
      source: a
      target: b
      value: c
      height: 400
      width: 1.0

  # 010-flowmap-panel — the seventh and final originally-listed panel
  # type, and this codebase's first real map. od_flows is the corrected
  # docs/GRAMMAR.md type: flowmap worked example's metric name;
  # origin/origin_lat/origin_lon/destination/dest_lat/dest_lon/value map
  # to its orig_taz/orig_lat/orig_lon/dest_taz/dest_lat/dest_lon/trips
  # columns verbatim (spec.md's own Grammar findings #2). No title here
  # shares a prefix with any pre-existing panel title in this file
  # (checked against the full list before choosing these — same
  # collision-avoidance discipline every prior panel-type feature's own
  # fixture additions have required since 007).
  row_flowmap:
    # Primary US1/US2 vehicle: direct-aggregation-match assertion
    # (including the duplicate (100, 300) pair summing to 200 — the
    # single largest post-aggregation flow, so real-world stakes are
    # visible in the rendered diagram, not just a unit test), global
    # filter reactivity (purpose HBW/NHB), the excludedCount/console.warn
    # signal (one non-positive-trips row, one missing-coordinate row),
    # and 004 expand/resize correctness including the relocation-survival
    # and mapReady-race tests.
    - type: flowmap
      title: Flow Map Trip Distribution Desire Lines
      metric: od_flows
      scenario: good_scenario
      origin: orig_taz
      origin_lat: orig_lat
      origin_lon: orig_lon
      destination: dest_taz
      dest_lat: dest_lat
      dest_lon: dest_lon
      value: trips
      clustering: true
      clustering_auto: true
      filter:
        purpose: $filters.purpose
      height: 500
      width: 1.0

    # Deliberately broken — points at a metric no scenario publishes.
    # Same convention as every other panel type's own "Broken Panel
    # (intentional)" entries.
    - type: flowmap
      title: Flow Map Broken Panel (intentional)
      metric: nonexistent_flowmap_metric
      scenario: good_scenario
      origin: a
      origin_lat: b
      origin_lon: c
      destination: d
      dest_lat: e
      dest_lon: f
      value: g
      height: 500
      width: 1.0

  # 013-zonemap-panel — the eighth and final originally-listed panel
  # type. boundaries/taz.geoparquet is this project's first geometry
  # fixture (published to public/geometry/ by tests/global-setup.js — see
  # data-model.md); boundaries_id: TAZ_ID / metric_id: taz_id join 8
  # synthetic Wasatch-Front-area zones (TAZ 100-800) to
  # tests/fixtures/generate.py's own VMT_BY_HOME_TAZ_ROWS. TAZ 800 never
  # appears in that metric under either purpose value (the permanent
  # "no data" case, FR-012); TAZ 900 appears in the metric but has no
  # matching geometry (the excluded-row case, FR-012) whenever the
  # 'purpose' filter includes it (NHB, or the 'all' default). No title
  # here shares a prefix with any pre-existing panel title in this file
  # (checked against the full list before choosing these — same
  # collision-avoidance discipline every prior panel-type feature's own
  # fixture additions have required since 007).
  row_zonemap:
    # Primary US1/US2 vehicle: core render, hover/click value display,
    # global filter reactivity (purpose HBW narrows to TAZ 100-400;
    # NHB narrows to TAZ 500/600/700 + the excluded 900), 004
    # expand/resize correctness, and basemap inheritance (this tab sets
    # no default_basemap — the app's light/dark theme pairing applies,
    # same path dashboard-1-summary.yaml's own flowmap panel above
    # already exercises). Also the diverging-midpoint-anchored-at-zero
    # regression vehicle (US3 Acceptance Scenario 2): TAZ 300's value
    # (0.0) is the true midpoint; TAZ 500's value (10.0) sits at this
    # domain's non-zero geometric center and must NOT render as neutral.
    - type: zonemap
      title: Zone Map VMT per Capita
      metric: vmt_by_home_taz
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      label: VMT / Capita
      color_scale: diverging
      color_ramp: RdBu
      domain: [-10, 30]
      filter:
        purpose: $filters.purpose
      center: [-111.925, 40.705]
      zoom: 11
      height: 450
      width: 0.5

    # US1 Acceptance Scenario 3 vehicle: no `domain` configured — the
    # color scale's domain auto-computes from the actual min/max of the
    # returned rows (FR-007). No `filter:` either, so every VMT_BY_HOME_
    # TAZ_ROWS row returns unfiltered (both purposes) — min -8.0 (TAZ
    # 100), max 25.0 (TAZ 700). `color_scale: sequential` with no
    # `color_ramp` exercises the token-derived fallback default
    # (research.md §8) rather than a named d3-scale-chromatic ramp.
    - type: zonemap
      title: Zone Map VMT per Capita (Auto Domain)
      metric: vmt_by_home_taz
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      label: VMT / Capita
      color_scale: sequential
      center: [-111.925, 40.705]
      zoom: 11
      height: 450
      width: 0.5

    # US3 Acceptance Scenario 3 vehicle — comparison: diff between the
    # `observed` baseline (flat 5.0 per TAZ, generate.py's
    # VMT_BY_HOME_TAZ_OBSERVED_ROWS) and `good_scenario` (b - a): TAZ 100
    # -8.0-5.0=-13.0 ... TAZ 700 25.0-5.0=20.0 — a direct,
    # hand-verifiable per-zone diff (research.md §7).
    - type: zonemap
      title: Zone Map VMT Diff (Good vs Observed)
      metric: vmt_by_home_taz
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      label: VMT / Capita Diff
      color_scale: diverging
      domain: [-15, 25]
      comparison:
        type: diff
        a: observed
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      center: [-111.925, 40.705]
      zoom: 11
      height: 450
      width: 0.5

    # US3 Acceptance Scenario 4 vehicle — `a` names a scenario no
    # manifest ever registers. Fails naturally at query time (DuckDB
    # "table does not exist"), same shared error state as any other
    # unresolvable configuration (research.md §7's own corrected,
    # validation-free design).
    - type: zonemap
      title: Zone Map Diff Unresolvable Scenario (intentional)
      metric: vmt_by_home_taz
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      color_scale: diverging
      domain: [-15, 25]
      comparison:
        type: diff
        a: nonexistent_scenario_xyz
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      height: 450
      width: 0.5

    # Deliberately broken — points at a metric no scenario publishes.
    # Same convention as every other panel type's own "Broken Panel
    # (intentional)" entries.
    - type: zonemap
      title: Zone Map Broken Panel (intentional)
      metric: nonexistent_zonemap_metric
      scenario: good_scenario
      boundaries: taz.geoparquet
      boundaries_id: TAZ_ID
      metric_id: taz_id
      column: vmt_per_capita
      height: 450
      width: 0.5

    # 019-baseline-diff-consumption's own zonemap $baseline coverage lives
    # on the Detail tab instead (dashboard-2-detail.yaml) — a precaution,
    # not a confirmed fix for a proven regression. A single git-stash
    # comparison first suggested adding one more WebGL-context-consuming
    # zonemap panel to THIS tab (already host to 012-webgl-context-
    # management's own flowmap/zonemap context-ceiling tests) was
    # destabilizing that feature's own real-context-loss simulation test.
    # A larger, repeated-run comparison afterward (4 runs on each side)
    # showed that conclusion was WRONG: the test fails at a similar rate
    # (roughly 1 in 3-4 runs) with or without this panel present on this
    # tab, including on the clean pre-019 commit — genuine, pre-existing
    # flakiness in that test, not something this feature caused. Left on
    # the Detail tab anyway (harmless, arguably still marginally better
    # practice), but the move is NOT a proven fix — recorded here plainly
    # rather than leaving the original, disproven "deterministic
    # regression" claim standing uncorrected.

  # 019-baseline-diff-consumption — the same '$baseline' sentinel coverage
  # as the zonemap panel above, extended to plotly/table/observable-plot
  # (spec.md User Story 3: one shared convention, not four). Reuses
  # vmt_by_home_taz's own real fixture data throughout. compare_on is
  # REQUIRED here (no zonemap-style metric_id default exists for these
  # three panel types — research.md §1/§3).
  row_baseline_diff:
    - type: table
      title: Table VMT Diff via $baseline
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: "$baseline"
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      columns:
        - { field: taz_id, label: TAZ }
        - { field: diff_value, label: Diff, format: "{:.1f}" }
      width: 0.33

    - type: plotly
      title: Plotly VMT Diff via $baseline
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: "$baseline"
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      traces:
        - type: bar
          x: $metric.taz_id
          y: $metric.diff_value
      width: 0.33

    - type: observable-plot
      title: Observable Plot VMT Diff via $baseline
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: "$baseline"
        b: good_scenario
        expr: "b.vmt_per_capita - a.vmt_per_capita"
      mark: barY
      x: taz_id
      y: diff_value
      width: 0.34

  # 019-baseline-diff-consumption — the zero-baseline percent-diff
  # degenerate case (FR-013/FR-014). Tests set baseline to good_scenario
  # (via the debug hook), which has a genuine 0.0 at TAZ 300
  # (VMT_BY_HOME_TAZ_ROWS) — NULLIF(b.vmt_per_capita, 0) turns that one
  # row's percent-diff into SQL NULL, never Infinity/NaN; every other TAZ
  # gets a real, non-null percentage.
  row_baseline_pct_diff:
    - type: table
      title: Table VMT Percent Diff via $baseline (zero-baseline case)
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: observed
        b: "$baseline"
        expr: "(a.vmt_per_capita - b.vmt_per_capita) * 1.0 / NULLIF(b.vmt_per_capita, 0)"
      columns:
        - { field: taz_id, label: TAZ }
        - field: diff_value
          label: "% Diff"
          format: "{:.1%}"
          color_scale: diverging
          domain: [-1, 1]
      width: 0.34

    - type: plotly
      title: Plotly VMT Percent Diff via $baseline (zero-baseline case)
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: observed
        b: "$baseline"
        expr: "(a.vmt_per_capita - b.vmt_per_capita) * 1.0 / NULLIF(b.vmt_per_capita, 0)"
      traces:
        - type: bar
          x: $metric.taz_id
          y: $metric.diff_value
      width: 0.33

    - type: observable-plot
      title: Observable Plot VMT Percent Diff via $baseline (zero-baseline case)
      metric: vmt_by_home_taz
      compare_on: [taz_id]
      comparison:
        type: diff
        a: observed
        b: "$baseline"
        expr: "(a.vmt_per_capita - b.vmt_per_capita) * 1.0 / NULLIF(b.vmt_per_capita, 0)"
      mark: barY
      x: taz_id
      y: diff_value
      width: 0.33

  # 014-graphic-walker-panel — the ninth and last originally-listed panel
  # type. One full-width row, own row key (dashboardRenderer.tsx treats
  # `width` as a fraction of its OWN row's other panels, not the page —
  # tests/fixtures/dashboard-config/dashboard-2-detail.yaml's own comment
  # explains this in full). Added here specifically so this tab exercises
  # all nine now-built panel types together in one load (SC-005) — every
  # other panel type above already lives on this same tab.
  row_explore:
    - type: graphic-walker
      title: Free-form Visual Analytics (Summary Tab)
      dataset: trip_mode_share
      scenario: good_scenario
      width: 1.0

  # 029-shadcn-chart-panel — the tenth panel type. Reuses trip_mode_share/
  # trip_destination_dist verbatim (no new Parquet fixture data needed,
  # tasks.md T016/T017) — same fixture-reuse discipline every prior
  # panel-type feature's own additions to this file have followed. No
  # title here shares a prefix with any pre-existing panel title in this
  # file (checked against the full list before choosing these).
  row_recharts:
    # T016/T009: primary US1 vehicle — multi-series bar, one series per
    # distinct `mode` value, colored from --chart-1..--chart-5 in
    # first-seen order (rechartsEncoding.ts).
    - type: recharts
      title: Recharts Mode Breakdown (Bar)
      chart_type: bar
      metric: trip_mode_share
      scenario: good_scenario
      x: purpose
      y: share
      series: mode
      height: 350
      width: 0.34

    # T017/T010: same data-binding pattern, chart_type: line only —
    # exercises MARK_COMPONENTS' Line branch specifically. Pinned to
    # purpose: HBW via a literal (non-`$filters.`) filter value — without
    # it, `series: mode` would still leave two DISTINCT purposes sharing
    # the same distance_bin/mode key, so rechartsEncoding.ts's own
    # last-write-wins pivot would silently collapse them. Scoping to one
    # purpose keeps every (distance_bin, mode) combination unique, so the
    # rendered line points are unambiguous and hand-verifiable.
    - type: recharts
      title: Recharts Trip Length Frequency (Line)
      chart_type: line
      metric: trip_destination_dist
      scenario: good_scenario
      x: distance_bin
      y: trips
      series: mode
      filter:
        purpose: HBW
      height: 350
      width: 0.33

    # T017/T010: single-series case (no `series` configured) — the
    # rechartsEncoding.ts branch that synthesizes one chart-1-colored key
    # from the `y` field name itself. Pinned to purpose: HBW / mode: SOV
    # (both literal filters) so exactly one row exists per distance_bin —
    # the no-series branch never dedupes by x itself, so leaving purpose/
    # mode unscoped would render multiple points at the same x position.
    - type: recharts
      title: Recharts Trip Length Frequency (Area)
      chart_type: area
      metric: trip_destination_dist
      scenario: good_scenario
      x: distance_bin
      y: trips
      filter:
        purpose: HBW
        mode: SOV
      height: 350
      width: 0.33

  # 029-shadcn-chart-panel — deliberately its OWN row, separate from
  # row_recharts above: this file's established convention (row_table/
  # row_markdown/row_observable_plot are each their own row too) keeps a
  # row's total panel count reasonable, and here it also fixes a real,
  # confirmed layout bug found post-implementation (see RechartsPanel.tsx's
  # own comment on `aspect-auto w-full`) — six panels sharing ONE grid row
  # diluted the primary bar/line/area trio above to a much narrower column
  # share than intended, which (once that layout bug was fixed and charts
  # actually respected their real column width) made this trio's own
  # multi-series legend wrap onto extra lines and, in
  # rechartsPanel.spec.ts's own legend-click test, occasionally land
  # outside the default test viewport. Splitting the row gives both rows
  # their own full-width 3-way split instead of one diluted 6-way split.
  row_recharts_edge_cases:
    # T017/T011: deliberately invalid chart_type (not bar/line/area) —
    # exercises the real, surfaced configuration error spec.md's Edge
    # Cases requires (never a silent blank panel or an unintended
    # fallback chart type).
    - type: recharts
      title: Recharts Invalid Chart Type (intentional)
      chart_type: pie
      metric: trip_mode_share
      scenario: good_scenario
      x: purpose
      y: share
      height: 350
      width: 0.34

    # T012: a literal, non-`$filters.`/`$inputs.` filter value that
    # matches no row in trip_mode_share.purpose — a genuine, deterministic
    # zero-row result at initial load (sqlExpander.ts only substitutes
    # `$filters.`/`$inputs.` placeholders; a plain literal like this one
    # passes through unchanged into the WHERE clause). Exercises the
    # shared PanelEmptyState, same convention as every other data-bound
    # panel type's own empty-result coverage.
    - type: recharts
      title: Recharts Empty Result (intentional)
      chart_type: bar
      metric: trip_mode_share
      scenario: good_scenario
      x: purpose
      y: share
      filter:
        purpose: NonexistentPurpose
      height: 350
      width: 0.33

    # T012: deliberately broken — points at a metric no scenario
    # publishes. Same convention as every other panel type's own "Broken
    # Panel (intentional)" entries.
    - type: recharts
      title: Recharts Broken Panel (intentional)
      chart_type: bar
      metric: nonexistent_recharts_metric
      scenario: good_scenario
      x: a
      y: b
      height: 350
      width: 0.33

# 030-sidebar-navigation, US3: real accordion sub-navigation coverage
# against this tab's own already-rich, already-heavily-exercised row set —
# no new panel/metric data needed. Three sections, deliberately NOT
# covering every row on this tab (row_sankey/row_flowmap/row_zonemap/
# row_baseline_diff/etc. stay ungrouped) — FR-013's own "a layout row not
# referenced by any section still renders normally, just with no sidebar
# sub-nav entry" case needs real, live coverage too, not just the grouped
# case. "KPIs & Charts" groups TWO rows under one section (row_kpis +
# row_chart) — the real, multi-row-per-section vehicle; "Tables" and
# "Explore" each group exactly one — the common single-row case.
sections:
  - id: kpis_and_charts
    label: KPIs & Charts
    rows: [row_kpis, row_chart]
  - id: tables
    label: Tables
    rows: [row_table]
  - id: explore
    label: Explore
    rows: [row_explore]
