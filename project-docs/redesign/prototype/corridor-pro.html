<style>
/* Corridor Pro, round 4. Dark-first bento with layered depth. One question drives the whole page: focus on one scenario, or compare many. Compare is a global mode that every tile answers in the way that suits its chart. */
:root{--bg:#090C11;--bg2:#0E1218;--surface:#151A23;--tile:#141922;--tile-hi:#1A202B;--ink:#EEF1F5;--mute:#8F99A9;--line:#272F3C;--grid:#1F2632;--glass:rgba(18,23,31,.84);--glass-line:rgba(255,255,255,.09);--hi:rgba(255,255,255,.06);

--sh1:0 1px 0 var(--hi) inset,0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);--sh2:0 1px 0 var(--hi) inset,0 24px 60px -16px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.35);

:root[data-theme="light"]{--bg:#E6EAF0;--bg2:#EEF1F6;--surface:#FFFFFF;--tile:#FFFFFF;--tile-hi:#F6F8FB;--ink:#0E131A;--mute:#586376;--line:#DBE1E9;--grid:#E8ECF1;--glass:rgba(255,255,255,.88);--glass-line:rgba(14,19,26,.1);--hi:rgba(255,255,255,.9);--ok:#1B8D5C;--warn:#AD6F18;--fail:#D13E3B;--c-obs:#0E131A;--sh1:0 1px 0 var(--hi) inset,0 1px 2px rgba(20,30,45,.08),0 12px 28px -16px rgba(20,30,45,.28);--sh2:0 1px 0 var(--hi) inset,0 26px 60px -18px rgba(20,30,45,.4),0 4px 12px rgba(20,30,45,.12);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}

.sp{margin-left:auto}

.tb{padding:8px 14px 14px;flex:none;min-height:0;position:relative}

.tbl.score thead th{position:sticky;top:0;background:var(--tile);z-index:2}.refrow td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tag{font:11.5px var(--font);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px 2px 7px;border-radius:999px}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.pill.fail{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
.mini{border:1px solid var(--glass-line);background:transparent;border-radius:999px;height:28px;padding:0 11px;cursor:pointer;color:var(--mute);font-size:12.5px}.mini:hover:not(:disabled){color:var(--ink)}.mini:disabled{opacity:.4;cursor:default}.mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.dpill small{color:var(--mute);font-size:12px}.dpill select#sel-y{max-width:none}.dpill select{border:0;background:transparent;height:34px;cursor:pointer;font-weight:500;max-width:160px;outline-offset:3px}.dpill option{background:var(--surface);color:var(--ink)}
.dots6{display:inline-flex}.dots6 i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid var(--tile-hi)}.dots6 i:first-child{margin-left:0}
.cnt{font-weight:600}.chev{width:28px;height:28px;display:grid;place-items:center;color:var(--mute)}.chev svg{width:14px;height:14px}
.cmpbtn{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;cursor:pointer;color:var(--mute);font-weight:500}

.fonts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fc{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:transparent;text-align:left}.fc[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.fc b{display:block;font-size:22px;font-weight:600}.fc small{color:var(--mute)}

/* scen.js: fifteen sample scenarios defined by their effect on the baseline. Everything else is derived. */
(function () {
  const BASE = [64.9, 21.5, 2.8, 8.0, 1.0, 1.8], BOARD0 = [36.9, 22.8, 12.1, 18.4, 9.9, 6.6];

  const DEF = [
    ['Baseline', 'Base case', [0, 0, 0, 0, 0, 0], 9.86, 61.4, [1, 1, 1, 1, 1, 1], 1.03, 1, [0, 0], 1, {}, 1],
    ['Frequent transit', 'Transit', [-3.7, -.5, 3.2, .6, .3, .1], 9.81, 58.9, [1.67, 1.5, 1.87, 1.62, 1.33, 1.44], 1.07, 1.28, [6.5, 0], 1.03, {}, 1.06],

    ['BRT corridor', 'Transit', [-2.2, -.3, 2.0, .4, .1, 0], 9.84, 59.9, [1.1, 1.05, 1.05, 1.12, 1.8, 1.3], 1.03, 1.12, [4.0, .6], 1.02, {}, 1.03],
    ['Light rail extension', 'Transit', [-2.8, -.4, 2.6, .4, .2, 0], 9.84, 59.2, [1.45, 1.2, 1.2, 1.3, 1.1, 1.1], 1.04, 1.18, [5, 1.2], 1.02, {}, 1.04],
    ['Fare-free transit', 'Pricing', [-1.6, -.3, 1.9, 0, 0, 0], 9.86, 60.2, [1.35, 1.3, 1.3, 1.25, 1.4, 1.5], 1.0, 1.12, [2.4, 1.8], 1.01, {}, 1.02],
    ['Parking pricing', 'Pricing', [-3.0, .8, 1.1, .7, .3, .1], 9.78, 58.4, [1.22, 1.18, 1.2, 1.22, 1.2, 1.2], .97, 1.15, [1.2, 2.8], 1.02, { pm: .96 }, .99],
    ['Congestion pricing', 'Pricing', [-3.4, .6, 1.4, 1.0, .4, 0], 9.74, 57.9, [1.3, 1.25, 1.25, 1.3, 1.35, 1.3], .96, 1.2, [1.4, 3.0], 1.06, { am: .95, pm: .94 }, 1],
    ['Infill density', 'Land use', [-4.4, -.2, 1.6, 2.8, .6, -.4], 9.93, 57.6, [1.28, 1.18, 1.31, 1.18, 1.19, 1.26], .9, 1.22, [1.5, 3.2], .97, {}, .94],
    ['Job-center density', 'Land use', [-2.6, -.2, 1.2, 1.4, .2, 0], 9.90, 59.1, [1.15, 1.1, 1.1, 1.1, 1.12, 1.1], .94, 1.12, [1.2, 2.2], .98, {}, .97],
    ['Remote work', 'Behavior', [-1.0, -.2, -.1, .9, .3, .1], 9.62, 59.6, [.93, .92, .92, .9, .94, .95], 1.05, 1, [0, -.4], 1.04, { am: .88, mid: 1.15, pm: .9 }, 1],
    ['Road diet', 'Roads', [-1.2, -.1, .5, .5, .3, 0], 9.87, 60.1, [1.08, 1.06, 1.06, 1.1, 1.12, 1.1], .98, 1.05, [.6, .8], .96, {}, 1],
    ['Bike network', 'Roads', [-1.2, -.1, .2, .2, .9, 0], 9.88, 60.4, [1.04, 1.04, 1.04, 1.05, 1.06, 1.05], .97, 1.04, [.4, .8], 1, {}, 1],
    ['Autonomous vehicles', 'Technology', [2.6, .9, -1.7, -1.4, -.4, 0], 10.12, 66.8, [.82, .82, .82, .8, .85, .85], 1.12, .8, [-1.5, -1], 1.08, { am: 1.05, pm: 1.06 }, 1.02],
    ['Combined package', 'Package', [-6.4, -.6, 4.6, 1.7, .9, -.2], 9.86, 54.9, [1.9, 1.6, 1.6, 1.7, 1.9, 1.8], 1.0, 1.4, [8, 4], 1.02, {}, 1.08],
  ];
  const S = { SC: DEF.map((d) => d[0]), IDX: {}, SHARE: { Observed: [63.8, 22.1, 3.1, 8.4, 1.2, 1.4] }, TRIPS: { Observed: 9.82 }, VMT: { Observed: 61.9 }, BOARD: { Observed: [38.2, 21.4, 12.9, 17.6, 9.4, 7.1] },
    TL: { Observed: 1 }, A0F: { Observed: .91 }, ZFX: { Observed: [0, 0] }, SPEED: { Observed: 1 }, TODFX: {}, TAG: {}, FLOWT: { Observed: 1 },
    PAL: ['#8A94A6', '#4C8BF5', '#F2994A', '#2FBF8A', '#EB5757', '#A66CFF', '#18B4C8', '#E8C547', '#E26BA6', '#9C7A5B', '#7BC043', '#5865F2', '#B5179E', '#00897B', '#8E9E2A'],
    SAFE: ['#8C8C8C', '#0072B2', '#E69F00', '#009E73', '#D55E00', '#CC79A7', '#56B4E9', '#F0E442', '#4D4D4D', '#004B7A', '#B37700', '#00694D', '#9E4400', '#A5548A', '#99D3F5'] };
  DEF.forEach(([n, tag, d, tr, vm, bm, tl, a0, z, sp, tf, fl], i) => {
    S.IDX[n] = i; S.SHARE[n] = BASE.map((v, k) => +(v + d[k]).toFixed(1)); S.TRIPS[n] = tr; S.VMT[n] = vm; S.BOARD[n] = BOARD0.map((v, k) => +(v * bm[k]).toFixed(1));
    S.TL[n] = tl; S.A0F[n] = a0; S.ZFX[n] = z; S.SPEED[n] = sp; S.TODFX[n] = tf; S.TAG[n] = tag; S.FLOWT[n] = fl;
  });

  /* calibration rounds: an ordered family that converges on the base case, with noise that fades as it settles */
  const rr = (seed) => { let q = seed; return () => { q = (q * 16807) % 2147483647; return q / 2147483647; }; };
  const R = rr(42), N = 50, FINAL = [1.4, 2.2, 2.6, 3.9, 1.7, 4.6, 5.8, 2.9], START = [7.5, 8.2, 9.0, 10.5, 9.6, 11.8, 12.5, 8.8], DEV = [7.5, -3.2, -1.2, -1.8, -.5], CALR = {};
  S.ROUND = {}; S.FAM = { cal: { label: 'Calibration rounds', names: [], n: N } };
  for (let r = 1; r <= N; r++) {
    const name = 'Round ' + r, k = Math.pow(.88, r - 1), nz = Math.sqrt(k);
    const d = DEV.map((v) => v * k + (R() - .5) * .9 * nz), sb = -d.reduce((a, b) => a + b, 0);
    S.SC.push(name); S.ROUND[name] = r; S.FAM.cal.names.push(name); S.TAG[name] = 'Calibration round'; S.IDX[name] = 99;
    S.SHARE[name] = BASE.map((v, i) => +(v + (i < 5 ? d[i] : sb)).toFixed(2));
    S.TRIPS[name] = +(9.86 * (1 + .045 * k)).toFixed(3); S.VMT[name] = +(61.4 * (1 + .08 * k)).toFixed(2); S.BOARD[name] = BOARD0.map((v) => +(v * (1 - .4 * k)).toFixed(1));
    S.TL[name] = 1.03 * (1 + .07 * k); S.A0F[name] = 1 + .45 * k; S.ZFX[name] = [0, 0]; S.SPEED[name] = 1 - .06 * k; S.TODFX[name] = { am: 1 + .3 * k, pm: 1 - .12 * k }; S.FLOWT[name] = 1;
    CALR[name] = FINAL.map((e, i) => Math.max(.3, +(e + (START[i] - e) * k + (R() - .5) * .5 * nz).toFixed(2)));
  }
  S.CALR = (n) => CALR[n] || FINAL;
  S.OBS = { share: { src: '2023 household travel survey', n: 'n = 14,820 households', moe: [1.4, 1.1, .5, .9, .3, .4] }, boards: { src: '2023 on-board transit survey and APC counts', n: '41,300 boardings sampled' }, vmt: { src: 'UDOT traffic counts, 2023', n: '1,240 count stations' }, auto: { src: '2023 household travel survey', n: 'n = 14,820 households' } };

  /* milestone years: every alternative has a run for each model year. Alternatives differ more as the plan builds out, and growth lifts every volume. */
  S.YEARS = [{ y: 2023, label: 'Base year' }, { y: 2027, label: 'Opening year' }, { y: 2032, label: 'End of STIP' }, { y: 2036, label: 'End of RTP Phase I' }, { y: 2046, label: 'End of RTP Phase II' }, { y: 2055, label: 'Horizon year' }];
  const GT = { 2023: 1, 2027: 1.07, 2032: 1.16, 2036: 1.24, 2046: 1.4, 2055: 1.52 }, GV = { 2023: 1, 2027: 1.08, 2032: 1.19, 2036: 1.29, 2046: 1.48, 2055: 1.63 }, GB = { 2023: 1, 2027: 1.12, 2032: 1.3, 2036: 1.45, 2046: 1.8, 2055: 2.1 }, EF = { 2023: 0, 2027: .3, 2032: .6, 2036: .85, 2046: 1.1, 2055: 1.3 };
  S.BASEYEAR = 2023; S.year = 2023;
  const P = {}; DEF.forEach(([n, tag, d, tr, vm, bm, tl, a0, z, sp, tf, fl]) => { P[n] = { d, tr, vm, bm, tl, a0, z, sp, tf, fl }; });
  const at = (n, y) => { const p = P[n], e = EF[y], gt = GT[y], gv = GV[y], gb = GB[y];
    return { share: BASE.map((v, k) => +(v + p.d[k] * e).toFixed(2)), trips: +(9.86 * gt * (1 + (p.tr / 9.86 - 1) * e)).toFixed(3), vmt: +(61.4 * gv * (1 + (p.vm / 61.4 - 1) * e)).toFixed(2), board: BOARD0.map((v, k) => +(v * gb * (1 + (p.bm[k] - 1) * e)).toFixed(1)),
      tl: 1.03 * (1 + (p.tl / 1.03 - 1) * e) * (1 + .05 * (gt - 1)), a0: 1 + (p.a0 - 1) * e, z: [p.z[0] * e, p.z[1] * e], sp: Math.max(.6, 1 + (p.sp - 1) * e - .18 * (gv - 1)), tf: Object.fromEntries(Object.entries(p.tf).map(([k, v]) => [k, 1 + (v - 1) * e])), fl: 1 + (p.fl - 1) * e }; };
  S.setYear = (y) => { S.year = y; DEF.forEach(([n]) => { const v = at(n, y); S.SHARE[n] = v.share; S.TRIPS[n] = v.trips; S.VMT[n] = v.vmt; S.BOARD[n] = v.board; S.TL[n] = v.tl; S.A0F[n] = v.a0; S.ZFX[n] = v.z; S.SPEED[n] = v.sp; S.TODFX[n] = v.tf; S.FLOWT[n] = v.fl; }); };
  /* a metric for any scenario in any model year, without changing the current year */
  S.valAt = (n, y, k) => { const v = at(n, y); return { trips: v.trips, drive: v.share[0], transit: v.share[2], active: v.share[3] + v.share[4], vmt: v.vmt, boards: d3.sum(v.board), len: 7.6 * v.tl }[k]; };
  window.SCN = S;
})();

/* WFRC prototype core: sample data + Observable Plot / D3 chart builders.
   All visual styling comes from CSS tokens read live from :root. */
(function () {
  const SC = SCN.SC, SHARE = SCN.SHARE;
  const MODES = ['Drive alone', 'Shared ride', 'Transit', 'Walk', 'Bike', 'School bus'];
  const CAL = [
    ['Auto ownership', 'Households by vehicles', 1.4],
    ['Coordinated daily activity pattern', 'Persons by pattern', 2.2],
    ['Work location', 'Mean commute distance', 2.6],
    ['School location', 'Mean school distance', 3.9],
    ['Tour mode choice', 'Tours by mode', 1.7],
    ['Tour scheduling', 'Departure by hour', 4.6],
    ['Stop frequency', 'Stops per tour', 5.8],
    ['Trip mode choice', 'Trips by mode', 2.9],
  ];
  const status = (e) => (e <= 3 ? 'ok' : e <= 5 ? 'warn' : 'fail');
  const STATUS_LABEL = { ok: 'Within 3%', warn: 'Review', fail: 'Off target' };

  /* seeded RNG */
  function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* time of day */
  function tod(sc) {
    const P = { Observed: [7.5, 1, 12.5, 0.62, 16.8, 1.05], Baseline: [7.7, 1.08, 12.4, 0.6, 16.9, 1.0], 'Frequent transit': [7.6, 1.03, 12.5, 0.62, 16.8, 0.99], 'Infill density': [7.5, 0.99, 12.6, 0.64, 16.7, 1.04] };
    const fx = SCN.TODFX[sc] || {}, p = (P[sc] || P.Baseline).slice();
    p[1] *= fx.am || 1; p[3] *= fx.mid || 1; p[5] *= fx.pm || 1;
    const g = (h, m, s) => Math.exp(-0.5 * ((h - m) / s) ** 2);
    const raw = d3.range(24).map((h) => p[1] * g(h, p[0], 1.3) + p[3] * g(h, p[2], 2.6) + p[5] * g(h, p[4], 1.7) + 0.35 * g(h, 21, 2.6) + 0.06);
    const sum = d3.sum(raw);
    return raw.map((v, h) => ({ sc, hour: h, share: (v / sum) * 100 }));
  }

  /* synthetic zones (stand-in for TAZ geometry; the real app draws GeoParquet on MapLibre) */
  const W = 900, H = 560;
  const r = rng(11);
  const pts = d3.range(190).map(() => { const a = r() * 6.283, rad = Math.pow(r(), 0.8) * 0.5; return [W * (0.5 + Math.cos(a) * rad * 0.95 + (r() - 0.5) * 0.06), H * (0.5 + Math.sin(a) * rad * 0.95 + (r() - 0.5) * 0.06)]; });
  const vor = d3.Delaunay.from(pts).voronoi([10, 10, W - 10, H - 10]);
  const CORE = [W * 0.46, H * 0.5];
  const distCore = (p) => Math.hypot(p[0] - CORE[0], p[1] - CORE[1]);
  // rail corridor: a gentle diagonal polyline
  const RAIL = [[120, 470], [250, 410], [380, 340], [460, 285], [540, 235], [660, 170], [790, 110]];
  const distRail = (p) => d3.min(RAIL.slice(1).map((b, i) => { const a = RAIL[i]; const dx = b[0] - a[0], dy = b[1] - a[1]; const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy))); return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy)); }));
  const noise = pts.map(() => (r() - 0.5) * 1.2);
  function zoneVal(i, sc) {
    const dc = distCore(pts[i]), dr = distRail(pts[i]);
    let v = 0.4 + 7.5 * Math.exp(-dc / 130) + noise[i];
    const z = SCN.ZFX[sc] || [0, 0]; v += z[0] * Math.exp(-dr / 55) + z[1] * Math.exp(-dc / 160);
    return Math.max(0, v);
  }
  const ZONES = pts.map((p, i) => ({ id: 1000 + i * 7, i, cell: vor.renderCell(i), pop: Math.round(1800 + 5200 * Math.exp(-distCore(p) / 200) + 400 * noise[i]) }));

  /* tokens */
  function tok() {
    const cs = getComputedStyle(document.documentElement);
    const g = (n) => cs.getPropertyValue(n).trim();
    return { ink: g('--ink'), mute: g('--mute'), grid: g('--grid'), surface: g('--surface'), bg: g('--bg'), line: g('--line'),
      font: g('--font'), fs: parseFloat(g('--chart-fs')) || 12, r: parseFloat(g('--chart-r')) || 3,
      obs: g('--c-obs'), c: Object.fromEntries(SC.map((s) => [s, scColor(s)])),
      ok: g('--ok'), warn: g('--warn'), fail: g('--fail'), primary: g('--c-1') };
  }
  const tipOpt = (t) => ({ fill: t.surface, stroke: t.line, fontFamily: t.font, fontSize: t.fs });
  const base = (t, w, h, o) => Object.assign({ width: w, height: h, style: { background: 'transparent', color: t.mute, fontFamily: t.font, fontSize: t.fs + 'px', overflow: 'visible' } }, o);

function tabDocs(el){el.innerHTML=`<div class="doc"><h3>Documentation</h3><p class="lead">How to read this dashboard.</p>
 <h4>Focus and compare</h4><p>The dock always holds a <b>focus</b> scenario. Every chart shows that scenario on its own. Turn on <b>Compare</b> to bring in more scenarios and a <b>reference</b> to measure against. Values shows each scenario as is, Change shows the difference in the same units, and % change shows the relative difference.</p>
 <h4>How each chart compares</h4><table><thead><tr><th>Chart</th><th>In compare mode</th></tr></thead><tbody>
 <tr><td>Bars, lines, dumbbells, tables</td><td>Every compared scenario on the same axes, with the reference as a dashed line. Change mode centres the chart on zero.</td></tr>
 <tr><td>Treemap</td><td>Side by side with shared scales, or one treemap coloured by each cell's change from the reference.</td></tr>
 <tr><td>Sunburst, waffle, ridgeline</td><td>Side by side, up to four at a time, paged.</td></tr>
 <tr><td>Donut, flow, chord, slope</td><td>One scenario at a time with a selector. In Change mode the donut turns into a difference chart.</td></tr>
 <tr><td>Maps</td><td>Values side by side (up to four), Difference fill, or Swipe between the reference and the focus.</td></tr>
 <tr><td>Radar and population</td><td>Do not vary by scenario, so they stay the same.</td></tr></tbody></table>
 <h4>Model years</h4><p>Every alternative has a run for each model year: the base year 2023, the opening year 2027, the end of the STIP in 2032, the RTP phases in 2036 and 2046, and the 2055 horizon. The Year control switches every chart at once. In the base year all alternatives equal the baseline, because nothing has been built yet. Observed data and calibration rounds belong to the base year, so they appear only there. The Across model years chart shows the whole path, and clicking a year switches to it.</p>
 <h4>Calibration rounds</h4><p>A calibration run can have fifty rounds or more. Rounds are an ordered series, so they are drawn on a colour ramp from early to late and chosen from a strip in the scenario picker. The Calibration progress chart plots the metrics you tune, such as mode share, volumes and boardings, for every round at once, with the target band shaded. Click a round to focus it, or shift-click to add it to the comparison.</p>
 <h4>Observed data</h4><p>Observed values are published as aggregates only, each with its source and sample size. Where a margin of error is known, bars show it as a shaded band and tooltips say when a gap is within it.</p>
 <h4>Reading many scenarios</h4><p>The scorecard shades every cell by its distance from the reference, so all compared scenarios fit in one view. Hover a name in any legend to isolate that scenario in the chart. In side-by-side views, hovering a shape highlights the same shape in every panel and one tooltip lists each scenario with its change from the reference.</p>
 <h4>Shortcuts</h4><p><kbd>Esc</kbd> closes any open panel. Arrow keys move the swipe handle. Click a column header in the scorecard to sort.</p>
 <h4>About the data</h4><p>The charts read post-processed Parquet summaries. Observed values come from the 2023 household travel survey. This prototype uses sample data.</p></div>`}
