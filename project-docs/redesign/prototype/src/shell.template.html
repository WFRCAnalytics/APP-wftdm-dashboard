<style>
/* Corridor Pro, round 4. Dark-first bento with layered depth. One question drives the whole page: focus on one scenario, or compare many. Compare is a global mode that every tile answers in the way that suits its chart. */
:root{--bg:#090C11;--bg2:#0E1218;--surface:#151A23;--tile:#141922;--tile-hi:#1A202B;--ink:#EEF1F5;--mute:#8F99A9;--line:#272F3C;--grid:#1F2632;--glass:rgba(18,23,31,.84);--glass-line:rgba(255,255,255,.09);--hi:rgba(255,255,255,.06);

--c-1:#3DD6C6;--c-2:#FFB454;--c-3:#B58CFF;--c-obs:#EEF1F5;--accent:#3DD6C6;--chart-fs:11.5;--chart-r:5;--zoom:1;
--sh1:0 1px 0 var(--hi) inset,0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);--sh2:0 1px 0 var(--hi) inset,0 24px 60px -16px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.35);

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E6EAF0;--bg2:#EEF1F6;--surface:#FFFFFF;--tile:#FFFFFF;--tile-hi:#F6F8FB;--ink:#0E131A;--mute:#586376;--line:#DBE1E9;--grid:#E8ECF1;--glass:rgba(255,255,255,.88);--glass-line:rgba(14,19,26,.1);--hi:rgba(255,255,255,.9);--ok:#1B8D5C;--warn:#AD6F18;--fail:#D13E3B;--c-obs:#0E131A;--sh1:0 1px 0 var(--hi) inset,0 1px 2px rgba(20,30,45,.08),0 12px 28px -16px rgba(20,30,45,.28);--sh2:0 1px 0 var(--hi) inset,0 26px 60px -18px rgba(20,30,45,.4),0 4px 12px rgba(20,30,45,.12);color-scheme:light}}
:root[data-theme="light"]{--bg:#E6EAF0;--bg2:#EEF1F6;--surface:#FFFFFF;--tile:#FFFFFF;--tile-hi:#F6F8FB;--ink:#0E131A;--mute:#586376;--line:#DBE1E9;--grid:#E8ECF1;--glass:rgba(255,255,255,.88);--glass-line:rgba(14,19,26,.1);--hi:rgba(255,255,255,.9);--ok:#1B8D5C;--warn:#AD6F18;--fail:#D13E3B;--c-obs:#0E131A;--sh1:0 1px 0 var(--hi) inset,0 1px 2px rgba(20,30,45,.08),0 12px 28px -16px rgba(20,30,45,.28);--sh2:0 1px 0 var(--hi) inset,0 26px 60px -18px rgba(20,30,45,.4),0 4px 12px rgba(20,30,45,.12);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}

.nav{position:fixed;left:14px;top:14px;bottom:14px;width:68px;border-radius:24px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;z-index:30;transition:width .22s;overflow:hidden}
.nav:hover,.nav:focus-within{width:248px}
.ngrow{flex:1}.nbot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:4px}

h1{margin:0;font-size:clamp(28px,3.2vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.025em}.hd p{margin:6px 0 0;color:var(--mute);font-size:15px}

.kf svg{margin-left:auto;width:64px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:14px;height:14px;border-radius:5px;background:var(--grid)}.dots i.on{background:var(--ok)}.dots i.w{background:var(--warn)}.dots i.f{background:var(--fail)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tile{background:var(--tile);border:1px solid var(--glass-line);border-radius:24px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sh1);animation:rise .4s ease both}

.ibadge{font:500 11.5px var(--font);padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--mute)}
.xb{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;flex:none}.xb:hover{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}.xb svg{width:15px;height:15px}
.tctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 18px 0}
.gb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--glass-line);background:var(--tile-hi);box-shadow:0 1px 0 var(--hi) inset}.gb span{color:var(--mute);font-size:12.5px}.gb select{border:0;background:transparent;height:30px;cursor:pointer;font-weight:500;outline-offset:3px;padding-right:4px;max-width:180px}.gb option{background:var(--surface);color:var(--ink)}
.sw{display:flex;padding:3px;gap:2px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);flex-wrap:wrap}.sw button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}.sw button[aria-pressed=true]{background:var(--tile-hi);color:var(--ink);box-shadow:0 1px 0 var(--hi) inset,0 1px 3px rgba(0,0,0,.3)}
.sw.cmp button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 22%,var(--tile-hi))}
.sp{margin-left:auto}
.lgd{display:flex;gap:14px;flex-wrap:wrap;padding:8px 18px 0;color:var(--mute);font-size:12.5px;min-height:26px;max-height:70px;overflow:auto}
.lg{display:inline-flex;gap:7px;align-items:center}.lg i{width:10px;height:10px;border-radius:50%}.lg i.dash{width:14px;height:0;border-top:2px dashed var(--ink);border-radius:0}.sclg{cursor:default}.mlg{cursor:default}
.tb{padding:8px 14px 14px;flex:none;min-height:0;position:relative}
.map-tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:grid;gap:2px;font-size:12.5px;box-shadow:var(--sh2)}.map-tip span{color:var(--mute)}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-weight:500;color:var(--mute);text-align:left;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:8px;border-bottom:1px solid var(--grid)}.tbl .num{text-align:right;font:13px var(--mono)}.tbl th.num{font:500 12.5px var(--font)}
.tbl.score th small{display:block;color:var(--mute);font-weight:400;font-size:11px}.tbl.score th.sortable{cursor:pointer;vertical-align:bottom}.tbl.score th.sortable:hover{color:var(--ink)}.tbl.score td{padding:8px 10px;border-bottom:1px solid var(--bg2)}.tbl.score td.num{border-radius:6px}
.tbl.score thead th{position:sticky;top:0;background:var(--tile);z-index:2}.refrow td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tag{font:11.5px var(--font);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px 2px 7px;border-radius:999px}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.pill.fail{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
.mini{border:1px solid var(--glass-line);background:transparent;border-radius:999px;height:28px;padding:0 11px;cursor:pointer;color:var(--mute);font-size:12.5px}.mini:hover:not(:disabled){color:var(--ink)}.mini:disabled{opacity:.4;cursor:default}.mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* dock */
.dock{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:999px;flex-wrap:wrap;max-width:100%}
.dsep{width:1px;height:26px;background:var(--glass-line);flex:none}
.dpill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 14px;border-radius:999px;border:1px solid var(--glass-line);background:var(--tile-hi);cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 var(--hi) inset}
.dpill small{color:var(--mute);font-size:12px}.dpill select#sel-y{max-width:none}.dpill select{border:0;background:transparent;height:34px;cursor:pointer;font-weight:500;max-width:160px;outline-offset:3px}.dpill option{background:var(--surface);color:var(--ink)}
.dots6{display:inline-flex}.dots6 i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid var(--tile-hi)}.dots6 i:first-child{margin-left:0}
.cnt{font-weight:600}.chev{width:28px;height:28px;display:grid;place-items:center;color:var(--mute)}.chev svg{width:14px;height:14px}
.cmpbtn{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;cursor:pointer;color:var(--mute);font-weight:500}
.cmpbtn .tg{width:34px;height:20px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;transition:background .15s}.cmpbtn .tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .15s}
.cmpbtn[aria-pressed=true]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.cmpbtn[aria-pressed=true] .tg{background:var(--accent)}.cmpbtn[aria-pressed=true] .tg::after{transform:translateX(14px);background:#04161A}

.pk-tags{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}.pk-tags button{border:1px solid var(--glass-line);background:transparent;border-radius:999px;height:28px;padding:0 11px;cursor:pointer;color:var(--mute);font-size:12.5px}.pk-tags button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink);border-color:var(--accent)}
.pk-l{overflow:auto;padding:0 8px 8px}

.sdot{width:12px;height:12px;border-radius:50%}

/* settings modal */
.mscrim{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:3vh 3vw}
.modal{width:min(1040px,100%);height:min(720px,94vh);border-radius:26px;display:grid;grid-template-columns:210px 1fr;overflow:hidden;background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--sh2)}

.fonts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fc{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:transparent;text-align:left}.fc[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.fc b{display:block;font-size:22px;font-weight:600}.fc small{color:var(--mute)}

 const sw=strat=='switch'?`<label class="gb"><span>Scenario</span><select data-sw aria-label="Scenario">${WF.SC.filter(s=>S.active.has(s)).map(s=>`<option value="${s}" ${s==(st.sw&&S.active.has(st.sw)?st.sw:S.focus)?'selected':''}>${L(s)}</option>`).join('')}</select></label>`:'';
 const cm=cmps.length>1?`<div class="sw cmp" role="group" aria-label="Compare as">${cmps.map(k=>`<button aria-pressed="${k==strat}" data-s="${k}">${WF.STRAT[k]}</button>`).join('')}</div>`:(strat&&strat!='overlay'&&cmps.length==1?`<span class="ibadge">${WF.STRAT[strat]}</span>`:'');
 return `<section class="tile" style="grid-column:span ${w}" data-id="${id}"><div class="th"><div><div class="tt">${T.title}${badge}</div><div class="ts">${T.sub}</div></div><button class="xb" data-x aria-label="Expand">${svg('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>')}</button></div>
 <div class="tctl">${T.groups?`<label class="gb"><span>${T.groupLabel}</span><select data-g aria-label="${T.groupLabel}">${T.groups.map(g=>`<option value="${g.k}" ${g.k==gk?'selected':''}>${g.label}</option>`).join('')}</select></label>`:''}${cm}${sw}${vs.length>1?`<div class="sw sp" role="group" aria-label="Chart type">${vs.map(x=>`<button aria-pressed="${x.k==v.k}" data-v="${x.k}">${x.label}</button>`).join('')}</div>`:''}</div>

function wire(root,redraw){root.querySelectorAll('.tile').forEach(t=>{const id=t.dataset.id,st=stOf(id);const go=redraw||render;
 t.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.views[key(id)]=b.dataset.v;go(id)});
 t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st.strat=b.dataset.s;st.pg=0;go(id)});
 const g=t.querySelector('[data-g]');if(g)g.onchange=()=>{S.groups[key(id)]=g.value;go(id)};
 const sw=t.querySelector('[data-sw]');if(sw)sw.onchange=()=>{st.sw=sw.value;go(id)};
 const x=t.querySelector('[data-x]');if(x&&!root.closest('.scrim'))x.onclick=()=>openFocus(id)})}
function mountAll(root,items){const C=ctxNow();items.forEach(([id,def])=>{const t=$(`[data-id="${id}"]`,root);if(!t)return;WF.mountTile(id,S.views[key(id)]||def,S.groups[key(id)],$('[data-b]',t),$('[data-l]',t),C,stOf(id))})}
function render(){WF.assign(S.active);nav();dock();const n=WF.NAV.find(x=>x.k==S.page);$('#h1').textContent=n.title;$('#sub').textContent=n.sub;WF.clearTiles();const P=$('#page');
 if(n.stub){P.innerHTML='<div class="empty"><div><b>Explore</b>Not part of this prototype.</div></div>';return}
 const skip=(id)=>(WF.TILES[id].needs&&!S.compare)||(WF.TILES[id].family&&!isBase()),items=WF.PAGE_TILES[S.page].filter(([id])=>!skip(id)),lay=(S.page=='summary'&&S.compare?LAY.summary_c:LAY[S.page]).filter(([id])=>!skip(id));
 P.innerHTML=(S.page=='summary'&&S.compare&&identical()?'<div class="ynote">The compared scenarios have identical results for this year, so there is nothing to compare yet. Pick another year or add different scenarios.</div>':'')+(S.page=='summary'?hero():'')+`<div class="grid">`+lay.map(([id,w,h])=>tile(id,WF.PAGE_TILES[S.page].find(x=>x[0]==id)[1],id=='score'?Math.min(h,120+S.active.size*40):h,w)).join('')+`</div><div class="foot">Sample data for design review. Zones and basemaps are stylised stand-ins for the TAZ layer and tiles drawn on MapLibre in the product.</div>`;
 mountAll(P,items);wire(P)}

 const draw=()=>{s.innerHTML=tile(id,def,0,12).replace('style="height:0px"','style="height:calc(100% - 170px)"');const t=s.firstElementChild;t.style.gridColumn='';const x=t.querySelector('[data-x]');x.setAttribute('aria-label','Close');x.innerHTML=svg(ICON.close);

 WF.themeEditor($('#te'),DEFCOL,()=>{const r=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();S.colors={primary:r('primary'),secondary:r('secondary'),tertiary:r('tertiary')};if($('#page').children.length)render()},S.colors)}

 const draw=()=>{el.innerHTML=`<h3>Scenarios</h3><p class="lead">Choose which scenarios are in the compare set, give each a colour and a short name, reorder them, and mark the baseline. Colours stay with a scenario wherever it appears. Calibration rounds use a colour ramp and are chosen from the scenario picker.</p>
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><button class="btn" id="rc">Reset colours and names</button><button class="btn" id="ai">Compare all</button></div>
  <div id="sl">${IND().map((s,i)=>`<div class="srow" draggable="true" data-i="${i}" data-s="${s}"><span class="hnd" title="Drag to reorder">${svg(ICON.grip)}</span><label class="csw" style="background:${WF.scColor(s)}" title="Change colour"><input type="color" value="${WF.scColor(s)}" data-c="${s}" aria-label="Colour for ${L(s)}"></label><div><input class="lab" value="${(WF.scOver[s]&&WF.scOver[s].label)||''}" placeholder="${s}" data-l="${s}" aria-label="Display name for ${s}"><div style="color:var(--mute);font-size:12px;margin-top:3px">${SCN.TAG[s]} · ${WF.SHARE[s][2].toFixed(1)}% transit</div></div>
   <button class="swt" role="switch" aria-checked="${S.active.has(s)}" data-i2="${s}" aria-label="Compare ${L(s)}"></button>${S.baseline==s?'<span class="chipb">Baseline</span>':`<button class="mini" data-b="${s}">Set as baseline</button>`}<button class="mini" data-m="${i}:-1" aria-label="Move up" ${i?'':'disabled'}>↑</button><button class="mini" data-m="${i}:1" aria-label="Move down" ${i<IND().length-1?'':'disabled'}>↓</button></div>`).join('')}</div>`;
  el.querySelectorAll('[data-c]').forEach(inp=>{inp.oninput=()=>{(WF.scOver[inp.dataset.c]=WF.scOver[inp.dataset.c]||{}).color=inp.value;inp.closest('.csw').style.background=inp.value};inp.onchange=()=>{render();draw()}});
  el.querySelectorAll('[data-l]').forEach(inp=>{inp.onchange=()=>{(WF.scOver[inp.dataset.l]=WF.scOver[inp.dataset.l]||{}).label=inp.value.trim();render();draw()}});
  el.querySelectorAll('[data-i2]').forEach(b=>b.onclick=()=>{const s=b.dataset.i2;if(S.active.has(s)){if(S.active.size>1)S.active.delete(s)}else S.active.add(s);render();draw()});
  el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const old=S.baseline;S.baseline=b.dataset.b;if(S.ref===old)S.ref=S.baseline;render();draw()});
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.m.split(':').map(Number);const a=WF.SC.splice(i,1)[0];WF.SC.splice(i+d,0,a);render();draw()});
  $('#rc').onclick=()=>{Object.keys(WF.scOver).forEach(k=>delete WF.scOver[k]);render();draw()};$('#ai').onclick=()=>{IND().forEach(s=>S.active.add(s));render();draw()};
  el.querySelectorAll('.srow').forEach(r=>{r.ondragstart=e=>{dragI=+r.dataset.i;r.classList.add('drag');e.dataTransfer.effectAllowed='move'};r.ondragend=()=>r.classList.remove('drag');r.ondragover=e=>{e.preventDefault();r.classList.add('over')};r.ondragleave=()=>r.classList.remove('over');
   r.ondrop=e=>{e.preventDefault();const to=+r.dataset.i;if(dragI==null||dragI===to)return;const a=WF.SC.splice(dragI,1)[0];WF.SC.splice(to,0,a);dragI=null;render();draw()}})};

function thumb(b,w,h){const wrap=document.createElement('div');if(b.none){wrap.style.cssText=`height:${h}px;background:var(--tile);display:grid;place-items:center;color:var(--mute);font-size:12px`;wrap.textContent='Zones only';return wrap}
 const s=d3.select(wrap).append('svg').attr('viewBox','0 0 900 560').attr('preserveAspectRatio','xMidYMid slice').style('width','100%').style('height',h+'px').style('display','block');const g=s.append('g');WF.baseLayer(g,b);
 g.append('path').attr('d',d3.line().curve(d3.curveCatmullRom.alpha(.5))(WF.RAIL)).attr('fill','none').attr('stroke',b.dark?'#E8EDF3':'#243044').attr('stroke-width',6).attr('opacity',.7);return wrap}
function tabBm(el){const groups=[...new Set(WF.BM.map(b=>b.group))];if(!S.staged)S.staged=WF.bmId();
 const draw=()=>{const sel=WF.BM.find(b=>b.id==S.staged),applied=WF.BM.find(b=>b.id==WF.bmId());
  el.innerHTML=`<h3>Basemap</h3><p class="lead">Choose the map underneath every zone map and swipe. Pick a style to preview it, then apply. Nothing changes until you apply.</p><div class="bmw"><div id="cat">${groups.map(g=>`<h4>${g}</h4><div class="bmg">${WF.BM.filter(b=>b.group==g).map(b=>`<button class="bmc" role="radio" aria-checked="${S.staged==b.id}" data-id="${b.id}"><span class="bth"></span><span>${b.name}</span>${b.needsSource?'<small>Needs a PMTiles source</small>':''}${b.id==WF.bmId()?'<small>In use</small>':''}</button>`).join('')}</div>`).join('')}</div>

function tabDocs(el){el.innerHTML=`<div class="doc"><h3>Documentation</h3><p class="lead">How to read this dashboard.</p>
 <h4>Focus and compare</h4><p>The dock always holds a <b>focus</b> scenario. Every chart shows that scenario on its own. Turn on <b>Compare</b> to bring in more scenarios and a <b>reference</b> to measure against. Values shows each scenario as is, Change shows the difference in the same units, and % change shows the relative difference.</p>
 <h4>How each chart compares</h4><table><thead><tr><th>Chart</th><th>In compare mode</th></tr></thead><tbody>
 <tr><td>Bars, lines, dumbbells, tables</td><td>Every compared scenario on the same axes, with the reference as a dashed line. Change mode centres the chart on zero.</td></tr>
 <tr><td>Treemap</td><td>Side by side with shared scales, or one treemap coloured by each cell's change from the reference.</td></tr>
 <tr><td>Sunburst, waffle, ridgeline</td><td>Side by side, up to four at a time, paged.</td></tr>
 <tr><td>Donut, flow, chord, slope</td><td>One scenario at a time with a selector. In Change mode the donut turns into a difference chart.</td></tr>
 <tr><td>Maps</td><td>Values side by side (up to four), Difference fill, or Swipe between the reference and the focus.</td></tr>
 <tr><td>Radar and population</td><td>Do not vary by scenario, so they stay the same.</td></tr></tbody></table>
 <h4>Model years</h4><p>Every alternative has a run for each model year: the base year 2023, the opening year 2027, the end of the STIP in 2032, the RTP phases in 2036 and 2046, and the 2055 horizon. The Year control switches every chart at once. In the base year all alternatives equal the baseline, because nothing has been built yet. Observed data and calibration rounds belong to the base year, so they appear only there. The Across model years chart shows the whole path, and clicking a year switches to it.</p>
 <h4>Calibration rounds</h4><p>A calibration run can have fifty rounds or more. Rounds are an ordered series, so they are drawn on a colour ramp from early to late and chosen from a strip in the scenario picker. The Calibration progress chart plots the metrics you tune, such as mode share, volumes and boardings, for every round at once, with the target band shaded. Click a round to focus it, or shift-click to add it to the comparison.</p>
 <h4>Observed data</h4><p>Observed values are published as aggregates only, each with its source and sample size. Where a margin of error is known, bars show it as a shaded band and tooltips say when a gap is within it.</p>
 <h4>Reading many scenarios</h4><p>The scorecard shades every cell by its distance from the reference, so all compared scenarios fit in one view. Hover a name in any legend to isolate that scenario in the chart. In side-by-side views, hovering a shape highlights the same shape in every panel and one tooltip lists each scenario with its change from the reference.</p>
 <h4>Shortcuts</h4><p><kbd>Esc</kbd> closes any open panel. Arrow keys move the swipe handle. Click a column header in the scorecard to sort.</p>
 <h4>About the data</h4><p>The charts read post-processed Parquet summaries. Observed values come from the 2023 household travel survey. This prototype uses sample data.</p></div>`}
